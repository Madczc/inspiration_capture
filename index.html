      ui.authError.textContent = '';

      if (!email || !password) {
        ui.authError.textContent = '请输入邮箱和密码';
        return;
      }
      if (password.length < 6) {
        ui.authError.textContent = '密码至少 6 位';
        return;
      }

      try {
        const { data, error } = isSignUp
          ? await sbClient.auth.signUp({ email, password })
          : await sbClient.auth.signInWithPassword({ email, password });

        if (error) throw error;

        if (isSignUp && !data.session) {
          ui.authError.textContent = '注册成功，请登录';
          isSignUp = false;
          ui.authSubmit.textContent = '登录';
          ui.authToggle.textContent = '没有账号？注册';
          return;
        }

        isLoggedIn = true;
        await loadCloudData();
        await migrateLocalToCloudIfNeeded();
        ensureDefaults();
        showApp();
      } catch (e) {
        ui.authError.textContent = e.message || '登录失败';
      }
    }

    async function signOut() {
      await sbClient.auth.signOut();
      isLoggedIn = false;
      location.reload();
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function touch(record) {
      record.updatedAt = Date.now();
      record.deviceId = DEVICE_ID;
    }

    function extractTags(text) {
      const matches = text.match(/#[\w一-龥]+/g) || [];
      const tags = matches.map(tag => tag.slice(1).toLowerCase());
      return [...new Set(tags)];
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    }

    // 存储
    function loadFromStorage() {
      try {
        const v2 = localStorage.getItem(STORAGE_KEY_V2);
        if (v2) {
          const parsed = JSON.parse(v2);
          store.folders = parsed.folders || [];
          store.tagsColorMap = parsed.tagsColorMap || {};
          store.items = parsed.items || [];
          store.settings = parsed.settings || { selectedFolderId: null, draftPanelOpen: true, trashOpen: false, pinnedPanelOpen: true };
          return;
        }

        const v1 = localStorage.getItem(STORAGE_KEY_V1);
        if (v1) {
          migrateFromV1(JSON.parse(v1));
          return;
        }
      } catch (e) {
        console.error('读取本地数据失败', e);
      }
    }

    function loadLocalAsSnapshot() {
      try {
        const v2 = localStorage.getItem(STORAGE_KEY_V2);
        if (!v2) return { folders: [], tagsColorMap: {}, items: [], settings: { selectedFolderId: null, draftPanelOpen: true, trashOpen: false, pinnedPanelOpen: true } };
        return JSON.parse(v2);
      } catch (e) {
        console.error('读取本地快照失败', e);
        return { folders: [], tagsColorMap: {}, items: [], settings: { selectedFolderId: null, draftPanelOpen: true, trashOpen: false, pinnedPanelOpen: true } };
      }
    }

    function normalizeTimestamp(ts) {
      return Number(ts) || 0;
    }

    function mergeByTimestamp(cloudList, localList, idKey) {
      const map = new Map();

      cloudList.forEach(item => {
        const id = item[idKey];
        map.set(id, { ...item, source: 'cloud' });
      });

      localList.forEach(item => {
        const id = item[idKey];
        const existing = map.get(id);
        if (!existing) {
          map.set(id, { ...item, source: 'local' });
          return;
        }
        const cloudTime = normalizeTimestamp(existing.updatedAt);
        const localTime = normalizeTimestamp(item.updatedAt);
        if (localTime > cloudTime) {
          map.set(id, { ...item, source: 'local' });
        } else if (localTime === cloudTime) {
          // 时间戳完全相同时用 deviceId 字典序平局决胜，避免来回抖动
          const existingId = String(existing.deviceId || '');
          const itemId = String(item.deviceId || '');
          if (itemId > existingId) {
            map.set(id, { ...item, source: 'local' });
          }
        }
      });

      return Array.from(map.values());
    }

    function mergeTagColors(cloudMap, localMap) {
      const result = {};
      const allTags = new Set([...Object.keys(cloudMap), ...Object.keys(localMap)]);
      allTags.forEach(tag => {
        const cloudEntry = cloudMap[tag];
        const localEntry = localMap[tag];
        if (!cloudEntry) { result[tag] = localEntry; return; }
        if (!localEntry) { result[tag] = cloudEntry; return; }
        const cloudTime = normalizeTimestamp(cloudEntry.updatedAt);
        const localTime = normalizeTimestamp(localEntry.updatedAt);
        result[tag] = localTime > cloudTime ? localEntry : cloudEntry;
      });
      return result;
    }

    function mergeSettings(cloudSettings, localSettings) {
      const cloudTime = normalizeTimestamp(cloudSettings?.updatedAt);
      const localTime = normalizeTimestamp(localSettings?.updatedAt);
      const base = localTime >= cloudTime ? (localSettings || {}) : (cloudSettings || {});
      return { selectedFolderId: base.selectedFolderId || null, draftPanelOpen: base.draftPanelOpen !== false, trashOpen: base.trashOpen === true, pinnedPanelOpen: base.pinnedPanelOpen !== false, updatedAt: Date.now() };
    }

    function saveToStorage(options = {}) {
      try {
        localStorage.setItem(STORAGE_KEY_V2, JSON.stringify({
          folders: store.folders,
          tagsColorMap: store.tagsColorMap,
          items: store.items,
          settings: store.settings
        }));
      } catch (e) {
        console.error('保存本地数据失败', e);
      }
      if (!options.skipSync) scheduleSync();
    }

    function scheduleSync() {
      if (!sbClient || !isLoggedIn) return;
      if (!navigator.onLine) {
        syncState.status = 'offline';
        updateSyncIndicator();
        return;
      }
      if (isSyncing) {
        syncPending = true;
        return;
      }
      syncState.status = 'syncing';
      updateSyncIndicator();
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => saveToCloud(), SYNC_CONFIG.debounceMs);
    }

    function scheduleRetry() {
      if (syncState.retryTimer) clearTimeout(syncState.retryTimer);
      const delay = Math.min(SYNC_CONFIG.maxRetryDelayMs, 1000 * Math.pow(2, syncState.retryCount));
      syncState.retryCount += 1;
      syncState.retryTimer = setTimeout(() => {
        syncState.status = 'syncing';
        updateSyncIndicator();
        saveToCloud();
      }, delay);
    }

    async function loadCloudData() {
      const [foldersRes, itemsRes, tagsRes] = await Promise.all([
        sbClient.from('folders').select('*').order('position'),
        sbClient.from('items').select('*'),
        sbClient.from('tag_colors').select('*')
      ]);

      if (foldersRes.error) console.error(foldersRes.error);
      if (itemsRes.error) console.error(itemsRes.error);
      if (tagsRes.error) console.error(tagsRes.error);

      const cloudFolders = (foldersRes.data || []).map(f => ({ id: f.id, name: f.name, order: f.position, createdAt: f.created_at, updatedAt: f.updated_at, deviceId: f.device_id }));
      const cloudItems = (itemsRes.data || []).map(i => ({
        id: i.id,
        text: i.text,
        folderId: i.folder_id,
        tags: i.tags || [],
        status: i.status,
        progress: i.progress,
        action: i.action || '',
        result: i.result || '',
        createdAt: i.created_at,
        updatedAt: i.updated_at,
        pinnedAt: i.pinned_at,
        deleted: i.deleted || false,
        deletedAt: i.deleted_at || null,
        deviceId: i.device_id
      }));
      const cloudTags = {};
      (tagsRes.data || []).forEach(t => { cloudTags[t.tag] = { color: t.color, updatedAt: t.updated_at }; });

      const localSnapshot = loadLocalAsSnapshot();
      const localFolders = localSnapshot.folders || [];
      const localItems = localSnapshot.items || [];
      const localTags = localSnapshot.tagsColorMap || {};

      const mergedFolders = mergeByTimestamp(cloudFolders, localFolders, 'id');
      const mergedItems = mergeByTimestamp(cloudItems, localItems, 'id');
      const mergedTags = mergeTagColors(cloudTags, localTags);
      const mergedSettings = mergeSettings(store.settings, localSnapshot.settings);

      store.folders = mergedFolders;
      store.items = mergedItems;
      store.tagsColorMap = mergedTags;
      store.settings = mergedSettings;

      // 合并完成后，本地和云端保持一致
      saveToStorage();
    }

    async function saveToCloud() {
      if (!sbClient || !isLoggedIn || isSyncing) return false;
      if (!navigator.onLine) {
        syncState.status = 'offline';
        updateSyncIndicator();
        return false;
      }
      isSyncing = true;
      syncState.status = 'syncing';
      updateSyncIndicator();
      ensureDefaults();
      let hadError = false;
      try {
        const { data: { user } } = await sbClient.auth.getUser();
        if (!user) return false;
        const userId = user.id;

        // 用 upsert 同步（有则更新，无则插入），空数组也会覆盖云端空状态
        const fRes = await sbClient.from('folders').upsert(
          store.folders.map(f => ({
            id: f.id,
            user_id: userId,
            name: f.name,
            position: f.order,
            device_id: DEVICE_ID,
            created_at: Number(f.createdAt) || 0,
            updated_at: Number(f.updatedAt) || Date.now()
          })),
          { onConflict: 'id' }
        );
        if (fRes.error) { console.error('upsert folders 失败:', fRes.error); hadError = true; }

        // upsert items：规范化 folder_id，孤儿条目归到第一个文件夹
        const folderIds = new Set(store.folders.map(f => f.id));
        const fallbackFolderId = store.folders[0].id;
        const iRes = await sbClient.from('items').upsert(
          store.items.map(i => ({
            id: i.id,
            user_id: userId,
            text: String(i.text || ''),
            folder_id: folderIds.has(i.folderId) ? i.folderId : fallbackFolderId,
            device_id: DEVICE_ID,
            tags: (i.tags || []).filter(t => typeof t === 'string'),
            status: i.status || 'draft',
            progress: i.progress || 'not-started',
            action: i.action || '',
            result: i.result || '',
            created_at: Number(i.createdAt) || 0,
            updated_at: Number(i.updatedAt) || Date.now(),
            pinned_at: i.pinnedAt ? Number(i.pinnedAt) : null,
            deleted: i.deleted || false,
            deleted_at: i.deletedAt ? Number(i.deletedAt) : null
          })),
          { onConflict: 'id' }
        );
        if (iRes.error) { console.error('upsert items 失败:', iRes.error); hadError = true; }

        const tagEntries = Object.entries(store.tagsColorMap);
        const tRes = await sbClient.from('tag_colors').upsert(
          tagEntries.map(([tag, color]) => ({
            user_id: userId,
            tag,
            color: color.color,
            updated_at: Number(color.updatedAt) || Date.now()
          })),
          { onConflict: 'user_id,tag' }
        );
        if (tRes.error) { console.error('upsert tag_colors 失败:', tRes.error); hadError = true; }

        // 删除待彻底删除的条目（粉碎 / 清空垃圾箱）
        if (pendingDeleteIds.length) {
          const ids = pendingDeleteIds.splice(0, pendingDeleteIds.length);
          await sbClient.from('items').delete().in('id', ids);
        }

        if (hadError) throw new Error('部分 upsert 失败');

        syncState.lastSuccessAt = Date.now();
        syncState.retryCount = 0;
        syncState.status = 'idle';
        updateSyncIndicator();
        return true;
      } catch (e) {
        console.error('同步云端失败', e);
        syncState.status = 'error';
        updateSyncIndicator();
        scheduleRetry();
        return false;
      } finally {
        isSyncing = false;
        if (syncPending) {
          syncPending = false;
          scheduleSync();
        }
      }
    }

    function startCloudSync() {
      if (!sbClient || !isLoggedIn) return;
      setupRealtime();
      // 如果 5 秒内 Realtime 没成功订阅，自动降级为轮询
      setTimeout(() => {
        if (syncState.usePolling) startPolling();
      }, SYNC_CONFIG.realtimeTimeoutMs);
    }

    function setupRealtime() {
      if (!sbClient || !isLoggedIn) return;
      try {
        const tables = ['folders', 'items', 'tag_colors'];
        syncState.realtimeChannels = tables.map(table => {
          return sbClient
            .channel(`public:${table}`)
            .on('postgres_changes', { event: '*', schema: 'public', table }, () => {
              applyRemoteChanges();
            })
            .subscribe(status => {
              if (status === 'CHANNEL_ERROR' || status === 'CLOSED') {
                syncState.usePolling = true;
                stopPolling();
                startPolling();
              } else if (status === 'SUBSCRIBED') {
                syncState.usePolling = false;
                stopPolling();
              }
            });
        });
      } catch (e) {
        console.error('Realtime 订阅失败', e);
        syncState.usePolling = true;
        startPolling();
      }
    }

    function startPolling() {
      if (syncState.pollTimer) return;
      syncState.pollTimer = setInterval(() => {
        if (navigator.onLine) applyRemoteChanges();
      }, SYNC_CONFIG.pollIntervalMs);
    }

    function stopPolling() {
      if (syncState.pollTimer) {
        clearInterval(syncState.pollTimer);
        syncState.pollTimer = null;
      }
    }

    async function applyRemoteChanges() {
      if (!sbClient || !isLoggedIn || isSyncing) return;
      try {
        const since = Math.max(0, syncState.lastSuccessAt - 5000);
        const [foldersRes, itemsRes, tagsRes] = await Promise.all([
          sbClient.from('folders').select('*').gte('updated_at', since).order('position'),
          sbClient.from('items').select('*').gte('updated_at', since),
          sbClient.from('tag_colors').select('*').gte('updated_at', since)
        ]);

        if (foldersRes.error) console.error(foldersRes.error);
        if (itemsRes.error) console.error(itemsRes.error);
        if (tagsRes.error) console.error(tagsRes.error);

        const cloudFolders = (foldersRes.data || []).map(f => ({
          id: f.id, name: f.name, order: f.position,
          createdAt: f.created_at, updatedAt: f.updated_at, deviceId: f.device_id
        }));
        const cloudItems = (itemsRes.data || []).map(i => ({
          id: i.id, text: i.text, folderId: i.folder_id, tags: i.tags || [],
          status: i.status, progress: i.progress, action: i.action || '', result: i.result || '',
          createdAt: i.created_at, updatedAt: i.updated_at, pinnedAt: i.pinned_at,
          deleted: i.deleted || false, deletedAt: i.deleted_at || null, deviceId: i.device_id
        }));
        const cloudTags = {};
        (tagsRes.data || []).forEach(t => {
          cloudTags[t.tag] = { color: t.color, updatedAt: t.updated_at };
        });

        const localSnapshot = loadLocalAsSnapshot();
        store.folders = mergeByTimestamp(cloudFolders, store.folders, 'id');
        store.items = mergeByTimestamp(cloudItems, store.items, 'id');
        store.tagsColorMap = mergeTagColors(cloudTags, store.tagsColorMap);
        store.settings = mergeSettings(store.settings, localSnapshot.settings);

        saveToStorage({ skipSync: true });
        if (isUserTyping()) {
          // 用户正在输入时跳过渲染，避免打断输入；数据已合并到内存
          return;
        }
        render();
      } catch (e) {
        console.error('拉取远程变更失败', e);
      }
    }

    async function migrateLocalToCloudIfNeeded() {
      // 严格云端优先：只在「云端没有任何 folders 且没有任何 items」时才允许从本地迁移。
      // 并且本地必须有 items，才迁移；只有空 folders 不迁移，避免覆盖云端结构。
      if (store.folders.length > 0 || store.items.length > 0) return;
      const local = localStorage.getItem(STORAGE_KEY_V2);
      if (!local) return;
      try {
        const parsed = JSON.parse(local);
        if (!parsed.items || parsed.items.length === 0) return;
        if (!confirm('检测到本地有历史数据，云端为空。\n\n是否要覆盖云端？此操作会把本地数据上传到云端。\n（推荐：如果云端是你当前使用的数据，请点取消）')) return;
        store.folders = parsed.folders || [];
        store.tagsColorMap = parsed.tagsColorMap || {};
        store.items = parsed.items || [];
        store.settings = parsed.settings || store.settings;
        await saveToCloud();
        saveToStorage();
      } catch (e) {
        console.error('本地数据迁移失败', e);
      }
    }

    function migrateFromV1(v1) {
      const defaultFolder = { id: generateId('folder'), name: '未分类', order: 0 };
      store.folders = [defaultFolder];
      store.settings.selectedFolderId = defaultFolder.id;
      store.tagsColorMap = {};
      store.items = [];

      (v1.drafts || []).forEach((d, idx) => {
        store.items.push({
          id: d.id || generateId('item'),
          text: d.text,
          folderId: defaultFolder.id,
          tags: normalizeTags(d.tags || extractTags(d.text)),
          status: 'draft',
          progress: 'not-started',
          action: '',
          createdAt: d.createdAt || Date.now() + idx,
          pinnedAt: null
        });
      });

      (v1.archives || []).forEach((a, idx) => {
        const isPinned = a.pinned;
        const item = {
          id: a.id || generateId('item'),
          text: a.text,
          folderId: defaultFolder.id,
          tags: normalizeTags(a.tags || extractTags(a.text)),
          status: isPinned ? 'pinned' : 'archived',
          progress: isPinned ? 'in-progress' : 'not-started',
          action: a.action || '',
          createdAt: a.createdAt || Date.now() + idx,
          pinnedAt: isPinned ? (Date.now() + idx) : null
        };
        store.items.push(item);
      });

      store.items.forEach(item => {
        item.tags.forEach(tag => ensureTagColor(tag));
      });

      saveToStorage();
    }

    function normalizeTags(tags) {
      return [...new Set(tags.map(t => String(t).toLowerCase()))];
    }

    function ensureDefaults() {
      if (store.folders.length === 0) {
        const defaultFolders = ['学术', '手工', '运营', 'AI'];
        store.folders = defaultFolders.map((name, idx) => ({
          id: generateId('folder'),
          name,
          order: idx
        }));
      }
      if (!store.settings.selectedFolderId || !store.folders.find(f => f.id === store.settings.selectedFolderId)) {
        store.settings.selectedFolderId = store.folders[0].id;
      }
      if (store.settings.draftPanelOpen === undefined) {
        store.settings.draftPanelOpen = true;
      }
      if (store.settings.trashOpen === undefined) {
        store.settings.trashOpen = false;
      }
      if (store.settings.pinnedPanelOpen === undefined) {
        store.settings.pinnedPanelOpen = true;
      }
    }

    // 颜色
    function ensureTagColor(tag) {
      const entry = store.tagsColorMap[tag];
      if (!entry) {
        const used = Object.values(store.tagsColorMap).map(e => e.color);
        const available = DEFAULT_COLORS.filter(c => !used.includes(c));
        const color = available.length > 0 ? available[0] : DEFAULT_COLORS[used.length % DEFAULT_COLORS.length];
        store.tagsColorMap[tag] = { color, updatedAt: Date.now() };
      }
      return store.tagsColorMap[tag].color;
    }

    function getProgressLabel(progress) {
      const labels = {
        'not-started': '未开始',
        'in-progress': '进行中',
        'completed': '已完成'
      };
      return labels[progress] || '未开始';
    }

    function setTagColor(tag, color) {
      store.tagsColorMap[tag] = { color, updatedAt: Date.now() };
      saveToStorage();
      render();
    }

    function getTagColor(tag) {
      const entry = store.tagsColorMap[tag];
      return entry ? entry.color : ensureTagColor(tag);
    }

    function toggleTagFilter(tag) {
      uiState.selectedTag = uiState.selectedTag === tag ? null : tag;
      uiState.currentPage = 1;
      render();
    }

    // 搜索
    function getItemStatusLabel(item) {
      if (item.deleted) return '垃圾箱';
      if (item.status === 'draft') return '草稿箱';
      return '灵感清单';
    }

    function getFolderName(folderId) {
      const folder = store.folders.find(f => f.id === folderId);
      return folder ? folder.name : '未分类';
    }

    function isUserTyping() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName.toLowerCase();
      if (tag === 'textarea') return true;
      if (tag === 'input') {
        const type = active.type;
        return type === 'text' || type === 'search' || type === 'password' || type === 'email';
      }
      return false;
    }

    function extractKeywords(query) {
      return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    }

    function itemMatchesKeywords(item, keywords) {
      if (keywords.length === 0) return false;
      const text = (item.text || '').toLowerCase();
      const action = (item.action || '').toLowerCase();
      const result = (item.result || '').toLowerCase();
      const tags = (item.tags || []).map(t => t.toLowerCase()).join(' ');
      const source = `${text} ${action} ${result} ${tags}`;
      return keywords.every(k => source.includes(k));
    }

    function performSearch(query) {
      uiState.searchQuery = query;
      const keywords = extractKeywords(query);
      if (keywords.length === 0) {
        uiState.searchResults = [];
        return;
      }
      uiState.searchResults = store.items
        .filter(item => itemMatchesKeywords(item, keywords))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function clearSearch() {
      uiState.searchQuery = '';
      uiState.searchResults = [];
      ui.searchInput.value = '';
      renderSearchResults();
    }

    function navigateToItem(item) {
      if (!item) return;
      selectFolder(item.folderId);
      if (item.tags && item.tags.length > 0) {
        uiState.selectedTag = item.tags[0];
      }
      if (item.deleted) {
        store.settings.trashOpen = true;
        saveToStorage({ skipSync: true });
      }
      uiState.highlightItemId = item.id;
      uiState.searchQuery = '';
      uiState.searchResults = [];
      ui.searchInput.value = '';
      renderSearchResults();
      render();
      setTimeout(() => {
        const el = document.getElementById(`item-${item.id}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        setTimeout(() => {
          uiState.highlightItemId = null;
          render();
        }, 2500);
      }, 50);
    }

    function renderSearchResults() {
      if (!ui.searchResults) return;
      if (uiState.searchResults.length === 0) {
        ui.searchCount.textContent = '';
        ui.searchResults.style.display = 'none';
        ui.searchResults.innerHTML = '';
        return;
      }
      ui.searchCount.textContent = `${uiState.searchResults.length} 条`;
      ui.searchResults.style.display = 'block';
      ui.searchResults.innerHTML = uiState.searchResults.map(item => {
        const folderName = getFolderName(item.folderId);
        const statusLabel = getItemStatusLabel(item);
        const tagsHtml = item.tags.map(t => `<span class="search-result-tag">#${escapeHtml(t)}</span>`).join(' ');
        return `
          <div class="search-result-item" data-id="${item.id}">
            <div class="search-result-text">${escapeHtml(item.text)}</div>
            <div class="search-result-meta">
              <span>${escapeHtml(folderName)}</span>
              <span>${escapeHtml(statusLabel)}</span>
              ${tagsHtml}
            </div>
          </div>
        `;
      }).join('');

      ui.searchResults.querySelectorAll('.search-result-item').forEach(el => {
        el.addEventListener('click', () => {
          const item = store.items.find(i => i.id === el.dataset.id);
          navigateToItem(item);
        });
      });
    }

    // 灵感扭蛋
    function getGachaCandidates() {
      const currentFolder = getCurrentFolder();
      return store.items.filter(i =>
        i.folderId === currentFolder.id &&
        !i.deleted &&
        i.status !== 'draft' &&
        i.progress === 'not-started'
      );
    }

    function drawGacha() {
      const candidates = getGachaCandidates();
      if (candidates.length === 0) {
        uiState.gachaItem = null;
        renderGachaModal();
        return;
      }
      const index = Math.floor(Math.random() * candidates.length);
      uiState.gachaItem = candidates[index];
      renderGachaModal();
    }

    function pinGachaItem() {
      if (!uiState.gachaItem) return;
      pinItem(uiState.gachaItem.id, uiState.gachaItem.action);
      uiState.gachaItem = null;
      ui.gachaModalOverlay.classList.remove('open');
    }

    function redrawGacha() {
      const previousId = uiState.gachaItem ? uiState.gachaItem.id : null;
      const candidates = getGachaCandidates().filter(i => i.id !== previousId);
      if (candidates.length === 0) {
        // 只剩一个时允许重复抽
        drawGacha();
        return;
      }
      const index = Math.floor(Math.random() * candidates.length);
      uiState.gachaItem = candidates[index];
      renderGachaModal();
    }

    function closeGacha() {
      uiState.gachaItem = null;
      ui.gachaModalOverlay.classList.remove('open');
    }

    function renderGachaModal() {
      if (!ui.gachaModalOverlay) return;
      ui.gachaModalOverlay.classList.add('open');
      const item = uiState.gachaItem;
      if (!item) {
        ui.gachaContent.textContent = '';
        ui.gachaAction.style.display = 'none';
        ui.gachaResult.style.display = 'none';
        ui.gachaEmpty.style.display = 'block';
        ui.gachaActions.style.display = 'none';
        ui.gachaCloseActions.style.display = 'flex';
        return;
      }
      ui.gachaContent.textContent = item.text;
      if (item.action) {
        ui.gachaAction.textContent = `1分钟行动：${item.action}`;
        ui.gachaAction.style.display = 'block';
      } else {
        ui.gachaAction.style.display = 'none';
      }
      if (item.result) {
        ui.gachaResult.textContent = `行动备注：${item.result}`;
        ui.gachaResult.style.display = 'block';
      } else {
        ui.gachaResult.style.display = 'none';
      }
      ui.gachaEmpty.style.display = 'none';
      ui.gachaActions.style.display = 'flex';
      ui.gachaCloseActions.style.display = 'none';
    }

    // 派生数据
    function getCurrentFolder() {
      return store.folders.find(f => f.id === store.settings.selectedFolderId) || store.folders[0];
    }

    function getFolderItems(folderId, status) {
      return store.items.filter(i => i.folderId === folderId && !i.deleted && (!status || i.status === status));
    }

    function getFolderTags(folderId) {
      const tags = new Set();
      store.items
        .filter(i => i.folderId === folderId && !i.deleted && (i.status === 'archived' || i.status === 'pinned'))
        .forEach(i => i.tags.forEach(t => tags.add(t)));
      return [...tags].sort();
    }

    function getPinnedItems() {
      return store.items
        .filter(i => i.status === 'pinned' && i.progress === 'in-progress' && !i.deleted)
        .sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0));
    }

    // 文件夹操作
    function createFolder(name) {
      const now = Date.now();
      const folder = {
        id: generateId('folder'),
        name: name.trim() || '新文件夹',
        order: store.folders.length,
        createdAt: now,
        updatedAt: now,
        deviceId: DEVICE_ID
      };
      store.folders.push(folder);
      store.settings.selectedFolderId = folder.id;
      saveToStorage();
      render();
    }

    function renameFolder(id, name) {
      const folder = store.folders.find(f => f.id === id);
      if (folder) {
        folder.name = name.trim() || folder.name;
        touch(folder);
        uiState.editingItemId = null;
        saveToStorage();
        render();
      }
    }

    function deleteFolder(id) {
      if (store.folders.length <= 1) {
        showModal('至少需要保留一个文件夹');
        return;
      }
      if (!confirm('删除文件夹会同时删除其中的所有灵感，确定吗？')) return;
      store.items = store.items.filter(i => i.folderId !== id);
      store.folders = store.folders.filter(f => f.id !== id);
      if (store.settings.selectedFolderId === id) {
        store.settings.selectedFolderId = store.folders[0].id;
      }
      saveToStorage();
      render();
    }

    function selectFolder(id) {
      store.settings.selectedFolderId = id;
      uiState.currentPage = 1;
      saveToStorage();
      render();
    }

    function moveItemToFolder(itemId, folderId) {
      const item = store.items.find(i => i.id === itemId);
      if (item && item.folderId !== folderId) {
        item.folderId = folderId;
        touch(item);
        saveToStorage();
        render();
      }
    }

    function openMoveModal(itemId) {
      pendingMoveItemId = itemId;
      const item = store.items.find(i => i.id === itemId);
      const currentFolderId = item ? item.folderId : null;

      const options = store.folders.filter(f => f.id !== currentFolderId);
      if (options.length === 0) {
        ui.moveFolderList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:8px;">没有其他文件夹</div>';
      } else {
        ui.moveFolderList.innerHTML = options.map(f => `
          <div class="move-folder-option" data-id="${f.id}">${escapeHtml(f.name)}</div>
        `).join('');
      }

      ui.moveFolderList.querySelectorAll('.move-folder-option').forEach(opt => {
        opt.addEventListener('click', () => {
          moveItemToFolder(itemId, opt.dataset.id);
          closeMoveModal();
        });
      });

      ui.moveModalOverlay.classList.add('open');
    }

    function closeMoveModal() {
      ui.moveModalOverlay.classList.remove('open');
      pendingMoveItemId = null;
    }

    function showActionTooltip(text, x, y) {
      const tip = document.getElementById('actionTooltip');
      tip.textContent = text;
      tip.style.display = 'block';
      const offset = 14;
      const tipMaxWidth = 360;
      let left = x + offset;
      if (left + tipMaxWidth > window.innerWidth) {
        left = x - tipMaxWidth - offset;
      }
      tip.style.left = left + 'px';
      tip.style.top = (y + offset) + 'px';
    }

    function hideActionTooltip() {
      document.getElementById('actionTooltip').style.display = 'none';
    }

    // 灵感操作
    function handleDump() {
      const text = ui.captureInput.value.trim();
      if (!text) return;

      // 按行拆分：Shift+Enter 换行的每一行作为一个独立灵感
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length === 0) return;

      const folderId = getCurrentFolder().id;
      const selectedTag = uiState.selectedTag;
      lines.forEach(line => {
        let itemText = line;
        if (selectedTag && !extractTags(line).includes(selectedTag)) {
          itemText = `${line} #${selectedTag}`;
        }
        addItem(itemText, folderId);
      });

      ui.captureInput.value = '';
      render();
    }

    function addItem(text, folderId) {
      const tags = extractTags(text);
      tags.forEach(tag => ensureTagColor(tag));
      const now = Date.now();
      store.items.unshift({
        id: generateId('item'),
        text,
        folderId,
        tags,
        status: 'draft',
        progress: 'not-started',
        action: '',
        createdAt: now,
        updatedAt: now,
        deviceId: DEVICE_ID,
        pinnedAt: null
      });
      saveToStorage();
    }

    function approveItem(id) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.status = 'archived';
        item.progress = 'not-started';
        touch(item);
        saveToStorage();
        render();
      }
    }

    function deleteItem(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;
      const statusMap = { draft: '草稿', archived: '存档', pinned: '已钉住' };
      if (!confirm(`确定要删除这条${statusMap[item.status] || '灵感'}吗？`)) return;
      item.deleted = true;
      item.deletedAt = Date.now();
      touch(item);
      saveToStorage();
      render();
    }

    function getDeletedItems() {
      return store.items
        .filter(i => i.deleted)
        .sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
    }

    function restoreItem(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;
      item.deleted = false;
      item.deletedAt = null;
      touch(item);
      if (item.status !== 'draft') {
        item.status = 'archived';
        item.progress = 'not-started';
        item.pinnedAt = null;
      }
      saveToStorage();
      render();
    }

    function destroyItem(id) {
      if (!confirm('确定要彻底删除这条灵感吗？此操作不可恢复。')) return;
      store.items = store.items.filter(i => i.id !== id);
      pendingDeleteIds.push(id);
      saveToStorage();
      render();
    }

    function emptyTrash() {
      const deleted = store.items.filter(i => i.deleted);
      if (deleted.length === 0) return;
      if (!confirm(`确定要清空垃圾箱（${deleted.length} 条）吗？此操作不可恢复。`)) return;
      deleted.forEach(i => pendingDeleteIds.push(i.id));
      store.items = store.items.filter(i => !i.deleted);
      saveToStorage();
      render();
    }

    function exportData() {
      try {
        const data = {
          exportedAt: Date.now(),
          deviceId: DEVICE_ID,
          folders: store.folders,
          tagsColorMap: store.tagsColorMap,
          items: store.items,
          settings: store.settings
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inspiration-capture-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        console.error('导出失败', e);
        showModal('导出失败：' + (e.message || '未知错误'));
      }
    }

    function updateItemText(id, text) {
      const item = store.items.find(i => i.id === id);
      if (!item) return false;
      const trimmed = text.trim();
      if (!trimmed) {
        alert('内容不能为空');
        return false;
      }
      item.text = trimmed;
      item.tags = extractTags(trimmed);
      item.tags.forEach(tag => ensureTagColor(tag));
      touch(item);
      saveToStorage();
      return true;
    }

    function updateItemAction(id, text) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.action = text;
        touch(item);
        saveToStorage();
      }
    }

    function pinItem(id, actionText) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;

      item.action = (actionText || '').trim();
      item.status = 'pinned';
      item.progress = 'in-progress';
      item.pinnedAt = Date.now();
      touch(item);
      saveToStorage();
      render();
    }

    function cycleProgress(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;

      const transitions = {
        'not-started': 'in-progress',
        'in-progress': 'completed',
        'completed': 'not-started'
      };

      const newProgress = transitions[item.progress] || 'not-started';
      item.progress = newProgress;
      touch(item);

      if (newProgress === 'in-progress') {
        item.status = 'pinned';
        item.pinnedAt = Date.now();
      } else {
        item.status = 'archived';
        item.pinnedAt = null;
      }

      saveToStorage();
      render();
    }

    function archiveItem(id) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.status = 'archived';
        item.progress = 'completed';
        item.pinnedAt = null;
        touch(item);
        saveToStorage();
        render();
      }
    }

    function unpinItem(id) {
      archiveItem(id);
    }

    function updateItemResult(id, text) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.result = text;
        touch(item);
        saveToStorage();
      }
    }
    function startEditItem(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;
      uiState.editingItemId = id;
      uiState.editingText = item.text;
      render();
    }

    function saveItemEdit(id) {
      if (updateItemText(id, uiState.editingText)) {
        uiState.editingItemId = null;
        uiState.editingText = '';
        render();
      }
    }

    function cancelItemEdit() {
      uiState.editingItemId = null;
      uiState.editingText = '';
      render();
    }

    // 弹窗
    function showModal(message) {
      ui.modalMessage.textContent = message;
      ui.modalOverlay.classList.add('open');
    }

    function hideModal() {
      ui.modalOverlay.classList.remove('open');
    }

    // 事件绑定
    function bindEvents() {
      ui.dumpBtn.addEventListener('click', handleDump);
      ui.captureInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleDump();
        }
      });

      ui.draftToggle.addEventListener('click', () => {
        store.settings.draftPanelOpen = !store.settings.draftPanelOpen;
        saveToStorage();
        render();
      });

      ui.trashToggle.addEventListener('click', () => {
        store.settings.trashOpen = !store.settings.trashOpen;
        saveToStorage();
        render();
      });

      ui.pinnedToggle.addEventListener('click', () => {
        store.settings.pinnedPanelOpen = !store.settings.pinnedPanelOpen;
        saveToStorage();
        render();
      });

      ui.emptyTrashBtn.addEventListener('click', emptyTrash);
      ui.exportBtn.addEventListener('click', exportData);

      ui.addFolderBtn.addEventListener('click', () => {
        const name = prompt('新建文件夹名称：');
        if (name !== null) createFolder(name);
      });

      ui.modalClose.addEventListener('click', hideModal);
      ui.modalOverlay.addEventListener('click', (e) => {
        if (e.target === ui.modalOverlay) hideModal();
      });

      ui.moveCancel.addEventListener('click', closeMoveModal);
      ui.moveModalOverlay.addEventListener('click', (e) => {
        if (e.target === ui.moveModalOverlay) closeMoveModal();
      });

      // 搜索事件
      ui.searchInput.addEventListener('input', () => {
        performSearch(ui.searchInput.value);
        renderSearchResults();
      });

      ui.searchInput.addEventListener('focus', () => {
        if (uiState.searchResults.length > 0) {
          renderSearchResults();
        }
      });

      ui.searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          clearSearch();
        }
      });

      document.addEventListener('click', (e) => {
        if (!ui.searchBox.contains(e.target)) {
          ui.searchResults.style.display = 'none';
        }
      });

      // 扭蛋事件
      ui.gachaBtn.addEventListener('click', drawGacha);
      ui.gachaPin.addEventListener('click', pinGachaItem);
      ui.gachaRedraw.addEventListener('click', redrawGacha);
      ui.gachaClose.addEventListener('click', closeGacha);
      ui.gachaModalOverlay.addEventListener('click', (e) => {
        if (e.target === ui.gachaModalOverlay) closeGacha();
      });

    }

    // 渲染
    function render() {
      renderSidebar();
      renderPinned();
      renderDraftPanel();
      renderTable();
      renderMobileList();
      renderTrash();
    }

    function renderSidebar() {
      renderFolderList();
      renderTagList();
    }

    function renderFolderList() {
      const currentFolder = getCurrentFolder();
      ui.folderList.innerHTML = store.folders.sort((a, b) => a.order - b.order).map(folder => {
        const count = store.items.filter(i => i.folderId === folder.id && !i.deleted).length;
        const isSelected = folder.id === currentFolder.id;
        const isEditing = uiState.editingItemId === `folder_${folder.id}`;
        return `
          <div class="folder-item ${isSelected ? 'active' : ''}" data-id="${folder.id}">
            ${isEditing ? `
              <input type="text" class="inline-input folder-rename-input" value="${escapeHtml(folder.name)}" data-id="${folder.id}" />
            ` : `
              <div class="folder-name-wrap" style="flex:1;">
                <span class="folder-name">${escapeHtml(folder.name)}</span>
                <span class="folder-count">${count}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px;">
                <button class="folder-btn" data-id="${folder.id}" data-action="rename" title="重命名">✎</button>
                <button class="folder-btn danger" data-id="${folder.id}" data-action="delete" title="删除">×</button>
              </div>
            `}
          </div>
        `;
      }).join('');

      ui.folderList.querySelectorAll('.folder-item').forEach(item => {
        const id = item.dataset.id;
        const input = item.querySelector('.folder-rename-input');
        if (input) {
          input.focus();
          input.select();
          input.addEventListener('blur', () => renameFolder(id, input.value));
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') renameFolder(id, input.value);
            if (e.key === 'Escape') {
              uiState.editingItemId = null;
              render();
            }
          });
        } else {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.folder-btn')) return;
            selectFolder(id);
          });

          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', () => {
            item.classList.remove('drag-over');
          });
          item.addEventListener('drop', (e) => {
            e.preventDefault();
            item.classList.remove('drag-over');
            const itemId = e.dataTransfer.getData('text/plain');
            if (itemId) moveItemToFolder(itemId, id);
          });

          const renameBtn = item.querySelector('[data-action="rename"]');
          const deleteBtn = item.querySelector('[data-action="delete"]');

          if (renameBtn) {
            renameBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              uiState.editingItemId = `folder_${id}`;
              render();
            });
          }

          if (deleteBtn) {
            deleteBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm('删除这个文件夹？')) deleteFolder(id);
            });
          }
        }
      });
    }

    function renderTagList() {
      const currentFolder = getCurrentFolder();
      if (!currentFolder) return;
      const tags = getFolderTags(currentFolder.id);

      if (tags.length === 0) {
        ui.tagList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:8px 0;">该文件夹暂无标签</div>';
        return;
      }

      ui.tagList.innerHTML = tags.map(tag => {
        const color = getTagColor(tag);
        const count = store.items.filter(i =>
          i.folderId === currentFolder.id &&
          !i.deleted &&
          (i.status === 'archived' || i.status === 'pinned') &&
          i.tags.includes(tag)
        ).length;
        return `
          <div class="tag-item ${uiState.selectedTag === tag ? 'active' : ''}" data-tag="${escapeHtml(tag)}">
            <div class="tag-name-wrap">
              <span class="tag-dot" style="background:${color}"></span>
              <span class="tag-name">${escapeHtml(tag)}</span>
            </div>
            <span class="tag-count">${count}</span>
          </div>
        `;
      }).join('');

      ui.tagList.querySelectorAll('.tag-item').forEach(item => {
        item.addEventListener('click', () => {
          toggleTagFilter(item.dataset.tag);
        });
      });
    }

    function renderPinned() {
      const pinned = getPinnedItems();
      ui.pinnedCount.textContent = pinned.length;
      ui.pinnedPanel.classList.toggle('open', store.settings.pinnedPanelOpen);
      ui.pinnedToggle.querySelector('span').textContent = store.settings.pinnedPanelOpen ? '收起灵感落地' : '展开灵感落地';

      if (pinned.length === 0) {
        ui.pinnedList.innerHTML = '<div class="pinned-empty">还没有落地的灵感。在灵感清单中写下「1分钟行动」并钉住。</div>';
        return;
      }

      ui.pinnedList.innerHTML = pinned.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        return `
          <div class="pinned-card">
            ${isEditing ? `
              <div style="flex:1;">
                <textarea class="edit-textarea" data-id="${item.id}">${escapeHtml(uiState.editingText)}</textarea>
                <div class="edit-actions">
                  <button class="btn-save" data-id="${item.id}">保存</button>
                  <button class="btn-cancel" data-id="${item.id}">取消</button>
                </div>
              </div>
            ` : `
              <div class="pinned-content">
                <div class="pinned-text">${escapeHtml(item.text)}</div>
                ${item.tags.length ? `<div class="pinned-tags">${item.tags.map(t => `<span class="pinned-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                ${item.action ? `<div class="pinned-action">${escapeHtml(item.action)}</div>` : ''}
                ${item.result ? `<div class="pinned-action" style="background:var(--gray-bg); color:var(--gray-text);">${escapeHtml(item.result)}</div>` : ''}
                <div class="pinned-meta">${formatDate(item.createdAt)}</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="btn-done" data-id="${item.id}" title="完成">✔</button>
                <button class="btn-table" data-id="${item.id}" data-action="edit" title="编辑">编</button>
              </div>
            `}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.pinnedList, 'item');

      ui.pinnedList.querySelectorAll('.btn-done').forEach(btn => {
        btn.addEventListener('click', () => unpinItem(btn.dataset.id));
      });
    }

    function renderDraftPanel() {
      const currentFolder = getCurrentFolder();
      const drafts = getFolderItems(currentFolder.id, 'draft');
      ui.draftCount.textContent = drafts.length;
      ui.draftPanel.classList.toggle('open', store.settings.draftPanelOpen);
      ui.draftToggle.querySelector('span').textContent = store.settings.draftPanelOpen ? '收起草稿箱' : '显示草稿箱';

      if (drafts.length === 0) {
        ui.draftList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:12px 0;">当前文件夹草稿箱是空的。</div>';
        return;
      }

      ui.draftList.innerHTML = drafts.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        const highlightClass = uiState.highlightItemId === item.id ? 'highlight-item' : '';
        return `
          <div class="mobile-card ${highlightClass}" id="item-${item.id}">
            ${isEditing ? renderEditMode(item.id) : renderDraftCard(item)}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.draftList, 'item');

      ui.draftList.querySelectorAll('[data-action="approve"]').forEach(btn => {
        btn.addEventListener('click', () => approveItem(btn.dataset.id));
      });

      ui.draftList.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteItem(btn.dataset.id));
      });
    }

    function renderTrash() {
      const deleted = getDeletedItems();
      ui.trashCount.textContent = deleted.length;
      ui.trashPanel.classList.toggle('open', store.settings.trashOpen);
      ui.trashToggle.querySelector('span').textContent = store.settings.trashOpen ? '收起垃圾箱' : '显示垃圾箱';

      if (deleted.length === 0) {
        ui.trashList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:12px 0;">垃圾箱是空的。</div>';
        return;
      }

      ui.trashList.innerHTML = deleted.map(item => {
        const highlightClass = uiState.highlightItemId === item.id ? 'highlight-item' : '';
        return `
          <div class="trash-item ${highlightClass}" id="item-${item.id}">
            <div class="trash-item-text">${escapeHtml(item.text)}</div>
            <div class="trash-item-actions">
              <button class="btn-table" data-id="${item.id}" data-action="restore">还原</button>
              <button class="btn-table danger" data-id="${item.id}" data-action="destroy">粉碎</button>
            </div>
          </div>
        `;
      }).join('');

      ui.trashList.querySelectorAll('[data-action="restore"]').forEach(btn => {
        btn.addEventListener('click', () => restoreItem(btn.dataset.id));
      });

      ui.trashList.querySelectorAll('[data-action="destroy"]').forEach(btn => {
        btn.addEventListener('click', () => destroyItem(btn.dataset.id));
      });
    }

    function renderDraftCard(item) {
      return `
        <div class="mobile-text">${escapeHtml(item.text)}</div>
        ${item.tags.length ? `<div class="mobile-tags">${item.tags.map(t => `<span class="mobile-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="mobile-actions">
          <button class="btn-table btn-approve" data-id="${item.id}" data-action="approve">认可 ✓</button>
          <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
          <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
        </div>
        <div style="font-size:11px; color:var(--gray-text); margin-top:6px;">${formatDate(item.createdAt)}</div>
      `;
    }

    function renderEditMode(id) {
      return `
        <textarea class="edit-textarea" data-id="${id}">${escapeHtml(uiState.editingText)}</textarea>
        <div class="edit-actions">
          <button class="btn-save" data-id="${id}">保存</button>
          <button class="btn-cancel" data-id="${id}">取消</button>
        </div>
      `;
    }

    function renderPagination(total, container) {
      const totalPages = Math.ceil(total / ITEMS_PER_PAGE) || 1;
      const page = Math.max(1, Math.min(uiState.currentPage, totalPages));
      uiState.currentPage = page;

      const html = `
        <div class="pagination-bar" style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:8px; border:1px solid var(--line); background:var(--gray-bg);">
          <span style="font-size:12px; color:var(--gray-text);">共 ${total} 条 · ${ITEMS_PER_PAGE} 条/页 · 第 ${page}/${totalPages} 页</span>
          <div style="display:flex; gap:6px;">
            <button class="btn-table" data-page="prev" ${page <= 1 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>上一页</button>
            <button class="btn-table" data-page="next" ${page >= totalPages ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>下一页</button>
          </div>
        </div>
      `;

      // 插入到容器末尾
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      container.appendChild(wrapper.firstElementChild);

      container.querySelectorAll('.pagination-bar button').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.page;
          if (action === 'prev' && uiState.currentPage > 1) {
            uiState.currentPage -= 1;
          } else if (action === 'next') {
            const maxPage = Math.ceil(total / ITEMS_PER_PAGE) || 1;
            if (uiState.currentPage < maxPage) uiState.currentPage += 1;
          }
          render();
        });
      });
    }

    function renderTable() {
      const currentFolder = getCurrentFolder();
      let items = getFolderItems(currentFolder.id, 'archived').concat(
        getFolderItems(currentFolder.id, 'pinned')
      );

      if (uiState.selectedTag) {
        items = items.filter(i => i.tags.includes(uiState.selectedTag));
      }

      // 排序：进行中 → 未开始 → 已完成
      const progressOrder = { 'in-progress': 0, 'not-started': 1, 'completed': 2 };
      items.sort((a, b) => {
        const pa = progressOrder[a.progress] || 0;
        const pb = progressOrder[b.progress] || 0;
        if (pa !== pb) return pa - pb;
        return b.createdAt - a.createdAt;
      });

      if (items.length === 0) {
        ui.tableSection.innerHTML = '<div class="empty-state">该文件夹下还没有存档灵感。</div>';
        return;
      }

      const total = items.length;
      const totalPages = Math.ceil(total / ITEMS_PER_PAGE) || 1;
      if (uiState.currentPage > totalPages) uiState.currentPage = totalPages;
      const start = (uiState.currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = items.slice(start, start + ITEMS_PER_PAGE);

      const rows = pageItems.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        const progressLabel = getProgressLabel(item.progress);
        const progressClass = `progress-${item.progress}`;
        const highlightClass = uiState.highlightItemId === item.id ? 'highlight-item' : '';

        return `
          <tr class="${progressClass} ${highlightClass}" id="item-${item.id}">
            <td class="col-content">
              ${isEditing ? `
                <textarea class="edit-textarea" data-id="${item.id}">${escapeHtml(uiState.editingText)}</textarea>
                <div class="edit-actions">
                  <button class="btn-save" data-id="${item.id}">保存</button>
                  <button class="btn-cancel" data-id="${item.id}">取消</button>
                </div>
              ` : `<div class="cell-content" draggable="true" data-id="${item.id}" title="拖到左侧文件夹可移动">${escapeHtml(item.text)}</div>`}
            </td>
            <td class="col-progress">
              ${isEditing ? '' : `<button class="btn-table progress-btn ${progressClass}" data-id="${item.id}" data-action="progress">${progressLabel}</button>`}
            </td>
            <td class="col-actions">
              ${isEditing ? '' : `
                <div class="cell-actions">
                  <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
                  <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
                  <button class="btn-table" data-id="${item.id}" data-action="move">移动</button>
                  <button class="btn-table" data-id="${item.id}" data-action="archive">钉住</button>
                </div>
              `}
            </td>
            <td class="col-action-input">
              ${isEditing ? '' : `
                <input
                  type="text"
                  class="action-input-table"
                  placeholder="若只做1分钟，我先干嘛？"
                  value="${escapeHtml(item.action || '')}"
                  data-id="${item.id}"
                />
              `}
            </td>
            <td class="col-result-input">
              ${isEditing ? '' : `
                <input
                  type="text"
                  class="action-input-table"
                  placeholder="丢下参考/高光/复盘等珍贵瞬间"
                  value="${escapeHtml(item.result || '')}"
                  data-id="${item.id}"
                  data-field="result"
                />
              `}
            </td>
          </tr>
        `;
      }).join('');

      ui.tableSection.innerHTML = `
        <table class="inspiration-table">
          <thead>
            <tr>
              <th class="col-content">灵感</th>
              <th class="col-progress">进度</th>
              <th class="col-actions">操作</th>
              <th class="col-action-input">1分钟行动</th>
              <th class="col-result-input">行动备注</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      bindEditEvents(ui.tableSection, 'item');

      ui.tableSection.querySelectorAll('.cell-content[draggable="true"]').forEach(el => {
        el.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', el.dataset.id);
          e.dataTransfer.effectAllowed = 'move';
        });
      });

      ui.tableSection.querySelectorAll('.action-input-table').forEach(input => {
        input.addEventListener('input', () => {
          const item = store.items.find(i => i.id === input.dataset.id);
          if (!item) return;
          if (input.dataset.field === 'result') {
            item.result = input.value;
          } else {
            item.action = input.value;
          }
        });

        input.addEventListener('blur', () => {
          if (input.dataset.field === 'result') {
            updateItemResult(input.dataset.id, input.value);
          } else {
            updateItemAction(input.dataset.id, input.value);
          }
        });

        if (input.dataset.field === 'result') {
          input.addEventListener('mouseenter', (e) => {
            if (input.value) showActionTooltip(input.value, e.clientX, e.clientY);
          });
          input.addEventListener('mousemove', (e) => {
            if (input.value) showActionTooltip(input.value, e.clientX, e.clientY);
          });
          input.addEventListener('mouseleave', hideActionTooltip);
        }
      });

      ui.tableSection.querySelectorAll('.cell-actions button, .col-progress button').forEach(btn => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'delete') {
          btn.addEventListener('click', () => deleteItem(id));
        } else if (action === 'progress') {
          btn.addEventListener('click', () => cycleProgress(id));
        } else if (action === 'move') {
          btn.addEventListener('click', () => openMoveModal(id));
        } else if (action === 'archive') {
          btn.addEventListener('click', () => {
            const input = btn.closest('tr').querySelector('.action-input-table');
            pinItem(id, input ? input.value : '');
          });
        }
      });

      renderPagination(total, ui.tableSection);
    }

    function renderMobileList() {
      const currentFolder = getCurrentFolder();
      let items = getFolderItems(currentFolder.id, 'archived').concat(
        getFolderItems(currentFolder.id, 'pinned')
      );

      if (uiState.selectedTag) {
        items = items.filter(i => i.tags.includes(uiState.selectedTag));
      }

      const progressOrder = { 'in-progress': 0, 'not-started': 1, 'completed': 2 };
      items.sort((a, b) => {
        const pa = progressOrder[a.progress] || 0;
        const pb = progressOrder[b.progress] || 0;
        if (pa !== pb) return pa - pb;
        return b.createdAt - a.createdAt;
      });

      if (items.length === 0) {
        ui.mobileList.innerHTML = '<div class="empty-state">该文件夹下还没有存档灵感。</div>';
        return;
      }

      const total = items.length;
      const totalPages = Math.ceil(total / ITEMS_PER_PAGE) || 1;
      if (uiState.currentPage > totalPages) uiState.currentPage = totalPages;
      const start = (uiState.currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = items.slice(start, start + ITEMS_PER_PAGE);

      ui.mobileList.innerHTML = pageItems.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        const progressLabel = getProgressLabel(item.progress);
        const highlightClass = uiState.highlightItemId === item.id ? 'highlight-item' : '';
        return `
          <div class="mobile-card progress-${item.progress} ${highlightClass}" id="item-${item.id}">
            ${isEditing ? renderEditMode(item.id) : `
              <div class="mobile-text">${escapeHtml(item.text)}</div>
              ${item.tags.length ? `<div class="mobile-tags">${item.tags.map(t => `<span class="mobile-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
              <div class="mobile-actions">
                <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
                <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
                <button class="btn-table" data-id="${item.id}" data-action="move">移动</button>
                <button class="btn-table" data-id="${item.id}" data-action="archive">钉住</button>
              </div>
              <div style="margin-bottom:8px;">
                <button class="btn-table progress-btn progress-${item.progress}" data-id="${item.id}" data-action="progress" style="width:100%;">${progressLabel}</button>
              </div>
              <div class="mobile-action-box">
                <input
                  type="text"
                  placeholder="若只做1分钟，我先干嘛？"
                  value="${escapeHtml(item.action || '')}"
                  data-id="${item.id}"
                />
              </div>
              <div class="mobile-action-box" style="margin-top:6px;">
                <input
                  type="text"
                  placeholder="丢下参考/高光/复盘等珍贵瞬间"
                  value="${escapeHtml(item.result || '')}"
                  data-id="${item.id}"
                  data-field="result"
                />
              </div>
              <div style="font-size:11px; color:var(--gray-text); margin-top:6px;">${formatDate(item.createdAt)}</div>
            `}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.mobileList, 'item');

      ui.mobileList.querySelectorAll('.mobile-action-box input, .mobile-card > input').forEach(input => {
        input.addEventListener('input', () => {
          const item = store.items.find(i => i.id === input.dataset.id);
          if (!item) return;
          if (input.dataset.field === 'result') {
            item.result = input.value;
          } else {
            item.action = input.value;
          }
        });

        input.addEventListener('blur', () => {
          if (input.dataset.field === 'result') {
            updateItemResult(input.dataset.id, input.value);
          } else {
            updateItemAction(input.dataset.id, input.value);
          }
        });

        if (input.dataset.field === 'result') {
          input.addEventListener('mouseenter', (e) => {
            if (input.value) showActionTooltip(input.value, e.clientX, e.clientY);
          });
          input.addEventListener('mouseleave', hideActionTooltip);
        }
      });

      ui.mobileList.querySelectorAll('button').forEach(btn => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'delete') {
          btn.addEventListener('click', () => deleteItem(id));
        } else if (action === 'progress') {
          btn.addEventListener('click', () => cycleProgress(id));
        } else if (action === 'move') {
          btn.addEventListener('click', () => openMoveModal(id));
        } else if (action === 'archive') {
          btn.addEventListener('click', () => {
            const input = btn.closest('.mobile-card').querySelector('.mobile-action-box input');
            pinItem(id, input ? input.value : '');
          });
        }
      });

      renderPagination(total, ui.mobileList);
    }

    function bindEditEvents(container, type) {
      container.querySelectorAll('.edit-textarea').forEach(textarea => {
        textarea.focus();
        textarea.select();
        textarea.addEventListener('input', () => {
          uiState.editingText = textarea.value;
        });
        textarea.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            saveItemEdit(textarea.dataset.id);
          }
          if (e.key === 'Escape') {
            cancelItemEdit();
          }
        });
      });

      container.querySelectorAll('.btn-save').forEach(btn => {
        btn.addEventListener('click', () => saveItemEdit(btn.dataset.id));
      });

      container.querySelectorAll('.btn-cancel').forEach(btn => {
        btn.addEventListener('click', () => cancelItemEdit());
      });

      container.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => startEditItem(btn.dataset.id));
      });
    }

    init();
  </script>
</body>
</html>
