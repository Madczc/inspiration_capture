<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感捕捉器</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #FFFFFF;
      --text: #2C2C2C;
      --sage-light: #D1D8C5;
      --sage: #B2C6A8;
      --sage-dark: #8FA68A;
      --gray-bg: #F5F5F5;
      --gray-border: #DEDEDE;
      --gray-text: #888888;
      --danger: #C98B8B;
      --line: rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* 侧边栏 */
    .sidebar {
      width: 220px;
      padding: 20px 0;
      border-right: 1px solid var(--line);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-block {
      padding: 0 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-block:last-child {
      border-bottom: none;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--gray-text);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .folder-list,
    .tag-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .folder-item,
    .tag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }

    .folder-item:hover,
    .tag-item:hover {
      background: var(--gray-bg);
    }

    .folder-item.active,
    .tag-item.active {
      background: var(--sage-light);
      border-color: var(--sage);
    }

    .folder-item.drag-over {
      background: var(--sage);
      border-color: var(--sage-dark);
    }

    .cell-content[draggable="true"] {
      cursor: grab;
    }

    .cell-content[draggable="true"]:active {
      cursor: grabbing;
    }

    .folder-name-wrap,
    .tag-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .folder-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-count,
    .tag-count {
      font-size: 11px;
      color: var(--gray-text);
      background: var(--bg);
      padding: 1px 6px;
      min-width: 20px;
      text-align: center;
      border: 1px solid var(--gray-border);
      flex-shrink: 0;
    }

    .folder-item.active .folder-count,
    .tag-item.active .tag-count {
      background: var(--bg);
    }

    .folder-btn {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--gray-text);
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .folder-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .folder-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .tag-dot {
      width: 12px;
      height: 12px;
      border-radius: 0;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .tag-name::before {
      content: "#";
      color: var(--gray-text);
    }

    .btn-add {
      font-size: 11px;
      color: var(--gray-text);
      background: transparent;
      border: 1px solid var(--gray-border);
      padding: 2px 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-add:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* 颜色选择器 */
    .color-popover {
      position: absolute;
      background: var(--bg);
      border: 1px solid var(--gray-border);
      padding: 10px;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      gap: 8px;
      min-width: 140px;
    }

    .color-popover.open {
      display: flex;
    }

    .color-presets {
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 6px;
    }

    .color-preset {
      width: 20px;
      height: 20px;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .color-custom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--gray-text);
    }

    .color-custom-row input[type="color"] {
      width: 28px;
      height: 20px;
      border: 1px solid var(--gray-border);
      padding: 0;
      background: none;
      cursor: pointer;
    }

    /* 主内容区 */
    .main {
      flex: 1;
      padding: 24px 28px;
      max-width: calc(100% - 220px);
      min-width: 0;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 4px 0;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--gray-text);
    }

    /* 分区标题 */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--gray-text);
      text-transform: uppercase;
      margin: 24px 0 10px 0;
    }

    /* 输入区 */
    .capture-box {
      margin-bottom: 8px;
    }

    .capture-input {
      width: 100%;
      min-height: 72px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .capture-input:focus {
      border-color: var(--sage);
    }

    .capture-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .shortcut-hint {
      font-size: 11px;
      color: var(--gray-text);
    }

    .btn-primary {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:hover {
      background: var(--bg);
      color: var(--text);
    }

    /* 今日执行区 */
    .pinned-section {
      background: var(--sage-light);
      padding: 14px;
      margin-bottom: 20px;
    }

    .pinned-empty {
      font-size: 13px;
      color: var(--gray-text);
      padding: 8px 0;
    }

    .pinned-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg);
      padding: 12px;
      margin-bottom: 8px;
    }

    .pinned-card:last-child {
      margin-bottom: 0;
    }

    .pinned-content {
      flex: 1;
      min-width: 0;
    }

    .pinned-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 6px;
    }

    .pinned-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .pinned-tag {
      font-size: 11px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pinned-action {
      font-size: 13px;
      color: var(--sage-dark);
      padding: 6px 8px;
      background: var(--sage-light);
      margin-bottom: 4px;
    }

    .pinned-meta {
      font-size: 11px;
      color: var(--gray-text);
    }

    .btn-done {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1px solid var(--sage-dark);
      background: var(--bg);
      color: var(--sage-dark);
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
    }

    .btn-done:hover {
      background: var(--sage-light);
    }

    /* 草稿箱 */
    .draft-section {
      margin-bottom: 20px;
    }

    .draft-toggle {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid var(--gray-border);
      background: var(--gray-bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: inherit;
    }

    .draft-toggle:hover {
      background: var(--line);
    }

    .draft-count {
      background: var(--bg);
      padding: 1px 8px;
      font-size: 11px;
      color: var(--gray-text);
      border: 1px solid var(--gray-border);
    }

    .draft-panel {
      display: none;
      padding-top: 12px;
    }

    .draft-panel.open {
      display: block;
    }

    /* 表格区 */
    .table-section {
      overflow-x: auto;
      border: 1px solid var(--line);
    }

    .inspiration-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 600px;
    }

    .inspiration-table th,
    .inspiration-table td {
      padding: 8px 10px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .inspiration-table th {
      background: var(--gray-bg);
      font-weight: 600;
      font-size: 11px;
      color: var(--gray-text);
      white-space: nowrap;
    }

    .inspiration-table td {
      background: var(--bg);
    }

    .inspiration-table tr.pinned td {
      background: var(--sage-light);
    }

    .col-content {
      min-width: 200px;
      max-width: 360px;
    }

    .col-tag {
      width: 44px;
      text-align: center;
      cursor: help;
    }

    .col-actions {
      white-space: nowrap;
      width: 180px;
    }

    .col-progress {
      width: 80px;
      text-align: center;
      white-space: nowrap;
    }

    .progress-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      border: 1px solid transparent;
    }

    .progress-badge.progress-not-started {
      background: var(--gray-bg);
      color: var(--gray-text);
      border-color: var(--gray-border);
    }

    .progress-badge.progress-in-progress {
      background: var(--sage-light);
      color: var(--text);
      border-color: var(--sage);
    }

    .progress-badge.progress-completed {
      background: #E8E8E8;
      color: var(--gray-text);
      border-color: var(--gray-border);
    }

    .btn-table.progress-btn {
      min-width: 56px;
    }

    .btn-table.progress-not-started:hover {
      border-color: var(--text);
    }

    .btn-table.progress-in-progress {
      background: var(--sage-light);
      border-color: var(--sage);
    }

    .btn-table.progress-completed {
      background: #E8E8E8;
      color: var(--gray-text);
    }

    .inspiration-table tr.progress-in-progress td {
      background: var(--sage-light);
    }

    .col-action-input {
      min-width: 160px;
    }

    .col-result-input {
      min-width: 160px;
    }

    .cell-content {
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cell-tag-dot {
      width: 10px;
      height: 10px;
      margin: 0 auto;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .cell-actions {
      display: flex;
      gap: 4px;
    }

    .btn-table {
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-table:hover {
      border-color: var(--text);
    }

    .btn-table.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .action-input-table {
      width: 100%;
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .action-input-table:focus {
      border-color: var(--sage);
    }

    /* 编辑状态 */
    .edit-textarea {
      width: 100%;
      min-height: 64px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--sage);
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .edit-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-save {
      padding: 5px 12px;
      font-size: 12px;
      border: 1px solid var(--sage-dark);
      background: var(--sage-light);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-save:hover {
      background: var(--sage);
    }

    .btn-cancel {
      padding: 5px 12px;
      font-size: 12px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--gray-text);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-cancel:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* 移动端列表 */
    .mobile-list {
      display: none;
    }

    .mobile-card {
      border: 1px solid var(--line);
      padding: 12px;
      margin-bottom: 10px;
      background: var(--bg);
    }

    .mobile-card.pinned {
      background: var(--sage-light);
    }

    .mobile-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .mobile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .mobile-tag {
      font-size: 11px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mobile-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .mobile-actions .btn-table {
      flex: 1;
      padding: 6px 0;
    }

    .mobile-action-box {
      display: flex;
      gap: 6px;
    }

    .mobile-action-box input {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .mobile-action-box input:focus {
      border-color: var(--sage);
    }

    .mobile-action-box button {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--sage-dark);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .mobile-action-box button:hover {
      background: var(--sage-light);
    }

    /* 空状态 */
    .empty-state {
      font-size: 13px;
      color: var(--gray-text);
      padding: 16px;
      border: 1px solid var(--line);
      background: var(--gray-bg);
    }

    /* 登录界面 */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .auth-screen.hidden {
      display: none;
    }

    .auth-box {
      width: 320px;
      padding: 32px 28px;
      border: 1px solid var(--gray-border);
    }

    .auth-box h2 {
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 4px 0;
    }

    .auth-box p {
      font-size: 13px;
      color: var(--gray-text);
      margin: 0 0 20px 0;
    }

    .auth-field {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
      margin-bottom: 10px;
    }

    .auth-field:focus {
      border-color: var(--sage);
    }

    .auth-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 10px;
    }

    .auth-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    .auth-link {
      font-size: 12px;
      color: var(--gray-text);
      cursor: pointer;
      text-decoration: underline;
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
    }

    .auth-error {
      font-size: 12px;
      color: var(--danger);
      margin-bottom: 10px;
      min-height: 16px;
    }

    .auth-signout {
      font-size: 11px;
      color: var(--gray-text);
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
      padding: 0;
      font-family: inherit;
    }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg);
      padding: 24px;
      max-width: 360px;
      width: 90%;
      border: 1px solid var(--gray-border);
    }

    .modal-message {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-modal {
      padding: 8px 16px;
      font-size: 13px;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      font-family: inherit;
    }

    .btn-modal:hover {
      background: var(--bg);
      color: var(--text);
    }

    .move-folder-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
      max-height: 260px;
      overflow-y: auto;
    }

    .move-folder-option {
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--gray-border);
      cursor: pointer;
      background: var(--bg);
    }

    .move-folder-option:hover {
      background: var(--sage-light);
      border-color: var(--sage);
    }

    .inline-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid var(--gray-border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .inline-input:focus {
      border-color: var(--sage);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .sidebar-block {
        border-bottom: none;
        border-right: 1px solid var(--line);
        padding: 0 12px;
        min-width: 140px;
        flex-shrink: 0;
      }

      .sidebar-block:last-child {
        border-right: none;
      }

      .folder-list,
      .tag-list {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .folder-item,
      .tag-item {
        flex: 0 0 auto;
      }

      .main {
        max-width: 100%;
        padding: 16px;
      }

      .capture-hint {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .btn-primary {
        width: 100%;
      }

      .table-section {
        display: none;
      }

      .mobile-list {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>灵感捕捉器</h2>
      <p id="authSubtitle">登录以同步你的数据</p>
      <input type="email" id="authEmail" class="auth-field" placeholder="邮箱" autocomplete="email" />
      <input type="password" id="authPassword" class="auth-field" placeholder="密码" autocomplete="current-password" />
      <div class="auth-error" id="authError"></div>
      <button class="auth-btn" id="authSubmit">登录</button>
      <div style="text-align:center;">
        <button class="auth-link" id="authToggle">没有账号？注册</button>
      </div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-block">
        <div class="sidebar-title">
          <span>文件夹</span>
          <button class="btn-add" id="addFolderBtn">+ 新建</button>
        </div>
        <div class="folder-list" id="folderList"></div>
      </div>
      <div class="sidebar-block">
        <div class="sidebar-title"><span>当前标签</span></div>
        <div class="tag-list" id="tagList">
          <div class="empty-state" style="border:none; background:transparent; padding:8px 0;">该文件夹暂无标签</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div style="display:flex; align-items:flex-start; justify-content:space-between;">
          <div>
            <h1>灵感捕捉器</h1>
            <p>倾倒杂念，聚焦今日三件要事。</p>
          </div>
          <button class="auth-signout" id="signOutBtn" title="退出登录">退出登录</button>
        </div>
      </header>

      <section class="capture-box">
        <textarea
          id="captureInput"
          class="capture-input"
          placeholder="随便丢点什么进来…加 #标签"
        ></textarea>
        <div class="capture-hint">
          <span class="shortcut-hint">Enter 快速倾倒，Shift+Enter 换行</span>
          <button class="btn-primary" id="dumpBtn">倾倒灵感</button>
        </div>
      </section>

      <section class="draft-section">
        <button class="draft-toggle" id="draftToggle">
          <span>显示草稿箱</span>
          <span class="draft-count" id="draftCount">0</span>
        </button>
        <div class="draft-panel" id="draftPanel">
          <div id="draftList"></div>
        </div>
      </section>

      <section class="archive-section">
        <div class="section-title">灵感清单</div>
        <div class="table-section" id="tableSection">
          <div class="empty-state">该文件夹下还没有存档灵感。</div>
        </div>
        <div class="mobile-list" id="mobileList">
          <div class="empty-state">该文件夹下还没有存档灵感。</div>
        </div>
      </section>

      <section class="pinned-section" id="pinnedSection">
        <div class="section-title">今日执行</div>
        <div id="pinnedList">
          <div class="pinned-empty">还没有进行中的灵感。在灵感清单中点击进度按钮开始。</div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-actions">
        <button class="btn-modal" id="modalClose">知道了</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="moveModalOverlay">
    <div class="modal-box">
      <div class="modal-message">移动到哪个文件夹？</div>
      <div class="move-folder-list" id="moveFolderList"></div>
      <div class="modal-actions">
        <button class="btn-modal" id="moveCancel">取消</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_V1 = 'brain-dump-v1';
    const STORAGE_KEY_V2 = 'brain-dump-v2';
    const MAX_PINNED = 3;

    const DEFAULT_COLORS = [
      '#B2C6A8', '#D1D8C5', '#C9D4C2', '#A8C4A0', '#9EBF9A',
      '#D4C5B2', '#C5B8D4', '#B2C8D4', '#D4B2B2', '#D4D4B2'
    ];

    const store = {
      folders: [],
      tagsColorMap: {},
      items: [],
      settings: {
        selectedFolderId: null,
        draftPanelOpen: true
      }
    };

    const uiState = {
      editingItemId: null,
      editingText: '',
      colorEditingTag: null,
      selectedTag: null
    };

    const ui = {
      captureInput: document.getElementById('captureInput'),
      dumpBtn: document.getElementById('dumpBtn'),
      folderList: document.getElementById('folderList'),
      tagList: document.getElementById('tagList'),
      pinnedList: document.getElementById('pinnedList'),
      draftToggle: document.getElementById('draftToggle'),
      draftPanel: document.getElementById('draftPanel'),
      draftCount: document.getElementById('draftCount'),
      draftList: document.getElementById('draftList'),
      tableSection: document.getElementById('tableSection'),
      mobileList: document.getElementById('mobileList'),
      addFolderBtn: document.getElementById('addFolderBtn'),
      modalOverlay: document.getElementById('modalOverlay'),
      modalMessage: document.getElementById('modalMessage'),
      modalClose: document.getElementById('modalClose'),
      moveModalOverlay: document.getElementById('moveModalOverlay'),
      moveFolderList: document.getElementById('moveFolderList'),
      moveCancel: document.getElementById('moveCancel'),
      authScreen: document.getElementById('authScreen'),
      authEmail: document.getElementById('authEmail'),
      authPassword: document.getElementById('authPassword'),
      authError: document.getElementById('authError'),
      authSubmit: document.getElementById('authSubmit'),
      authToggle: document.getElementById('authToggle'),
      authSubtitle: document.getElementById('authSubtitle')
    };

    // Supabase 配置
    const SUPABASE_URL = 'https://wbdtglzcnwvttgxcnold.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiZHRnbHpjbnd2dHRneGNub2xkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTYwOTEsImV4cCI6MjEwMzQ3MjA5MX0.s_t5TDRT_-MYHJQAfzF5UycdbyvtWU_0jH8vYalMfq0';
    let sbClient = null;
    let isLoggedIn = false;
    let isSignUp = false;
    let syncTimer = null;
    let isSyncing = false;
    let syncPending = false;
    let pendingMoveItemId = null;

    // 初始化
    function init() {
      bindEvents();
      bindAuthEvents();

      if (!window.supabase) {
        // CDN 加载失败，回退到纯本地模式
        loadFromStorage();
        ensureDefaults();
        render();
        ui.authScreen.classList.add('hidden');
        ui.captureInput.focus();
        return;
      }

      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      checkAuth();
    }

    async function checkAuth() {
      const { data: { session } } = await sbClient.auth.getSession();
      if (session) {
        isLoggedIn = true;
        await loadCloudData();
        await migrateLocalToCloudIfNeeded();
        ensureDefaults();
        showApp();
      } else {
        showAuth();
      }
    }

    function showApp() {
      ui.authScreen.classList.add('hidden');
      render();
      ui.captureInput.focus();
    }

    function showAuth() {
      ui.authScreen.classList.remove('hidden');
    }

    // 认证事件
    function bindAuthEvents() {
      ui.authSubmit.addEventListener('click', handleAuth);
      ui.authPassword.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAuth();
      });
      ui.authToggle.addEventListener('click', () => {
        isSignUp = !isSignUp;
        ui.authSubmit.textContent = isSignUp ? '注册' : '登录';
        ui.authToggle.textContent = isSignUp ? '已有账号？登录' : '没有账号？注册';
        ui.authSubtitle.textContent = isSignUp ? '注册一个新账号' : '登录以同步你的数据';
        ui.authError.textContent = '';
      });

      const signOutBtn = document.getElementById('signOutBtn');
      if (signOutBtn) {
        signOutBtn.addEventListener('click', signOut);
      }
    }

    async function handleAuth() {
      const email = ui.authEmail.value.trim();
      const password = ui.authPassword.value;
      ui.authError.textContent = '';

      if (!email || !password) {
        ui.authError.textContent = '请输入邮箱和密码';
        return;
      }
      if (password.length < 6) {
        ui.authError.textContent = '密码至少 6 位';
        return;
      }

      try {
        const { data, error } = isSignUp
          ? await sbClient.auth.signUp({ email, password })
          : await sbClient.auth.signInWithPassword({ email, password });

        if (error) throw error;

        if (isSignUp && !data.session) {
          ui.authError.textContent = '注册成功，请登录';
          isSignUp = false;
          ui.authSubmit.textContent = '登录';
          ui.authToggle.textContent = '没有账号？注册';
          return;
        }

        isLoggedIn = true;
        await loadCloudData();
        await migrateLocalToCloudIfNeeded();
        ensureDefaults();
        showApp();
      } catch (e) {
        ui.authError.textContent = e.message || '登录失败';
      }
    }

    async function signOut() {
      await sbClient.auth.signOut();
      isLoggedIn = false;
      location.reload();
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function extractTags(text) {
      const matches = text.match(/#[\w一-龥]+/g) || [];
      const tags = matches.map(tag => tag.slice(1).toLowerCase());
      return [...new Set(tags)];
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 存储
    function loadFromStorage() {
      try {
        const v2 = localStorage.getItem(STORAGE_KEY_V2);
        if (v2) {
          const parsed = JSON.parse(v2);
          store.folders = parsed.folders || [];
          store.tagsColorMap = parsed.tagsColorMap || {};
          store.items = parsed.items || [];
          store.settings = parsed.settings || { selectedFolderId: null, draftPanelOpen: true };
          return;
        }

        const v1 = localStorage.getItem(STORAGE_KEY_V1);
        if (v1) {
          migrateFromV1(JSON.parse(v1));
          return;
        }
      } catch (e) {
        console.error('读取本地数据失败', e);
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_V2, JSON.stringify({
          folders: store.folders,
          tagsColorMap: store.tagsColorMap,
          items: store.items,
          settings: store.settings
        }));
      } catch (e) {
        console.error('保存本地数据失败', e);
      }
      scheduleSync();
    }

    function scheduleSync() {
      if (!sbClient || !isLoggedIn) return;
      if (isSyncing) {
        syncPending = true;
        return;
      }
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => saveToCloud(), 600);
    }

    async function loadCloudData() {
      const [foldersRes, itemsRes, tagsRes] = await Promise.all([
        sbClient.from('folders').select('*').order('position'),
        sbClient.from('items').select('*'),
        sbClient.from('tag_colors').select('*')
      ]);

      if (foldersRes.error) console.error(foldersRes.error);
      if (itemsRes.error) console.error(itemsRes.error);
      if (tagsRes.error) console.error(tagsRes.error);

      store.folders = (foldersRes.data || []).map(f => ({ id: f.id, name: f.name, order: f.position }));
      store.items = (itemsRes.data || []).map(i => ({
        id: i.id,
        text: i.text,
        folderId: i.folder_id,
        tags: i.tags || [],
        status: i.status,
        progress: i.progress,
        action: i.action || '',
        result: i.result || '',
        createdAt: i.created_at,
        pinnedAt: i.pinned_at
      }));
      store.tagsColorMap = {};
      (tagsRes.data || []).forEach(t => { store.tagsColorMap[t.tag] = t.color; });
    }

    async function saveToCloud() {
      if (!sbClient || !isLoggedIn || isSyncing) return;
      isSyncing = true;
      try {
        const { data: { user } } = await sbClient.auth.getUser();
        if (!user) return;
        const userId = user.id;

        // 清空云端三张表（RLS 只允许删自己的）
        const delItems = await sbClient.from('items').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if (delItems.error) console.error('delete items 失败:', delItems.error);
        const delFolders = await sbClient.from('folders').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if (delFolders.error) console.error('delete folders 失败:', delFolders.error);
        const delTags = await sbClient.from('tag_colors').delete().neq('tag', '__never__');
        if (delTags.error) console.error('delete tag_colors 失败:', delTags.error);

        if (store.folders.length) {
          const fRes = await sbClient.from('folders').insert(
            store.folders.map(f => ({ id: f.id, user_id: userId, name: f.name, position: f.order }))
          );
          if (fRes.error) console.error('insert folders 失败:', fRes.error);
        }

        // 插入 items：规范化 folder_id，孤儿条目归到第一个文件夹
        const folderIds = new Set(store.folders.map(f => f.id));
        const fallbackFolderId = store.folders.length ? store.folders[0].id : null;
        if (store.items.length && fallbackFolderId) {
          const iRes = await sbClient.from('items').insert(
            store.items.map(i => ({
              id: i.id,
              user_id: userId,
              text: String(i.text || ''),
              folder_id: folderIds.has(i.folderId) ? i.folderId : fallbackFolderId,
              tags: (i.tags || []).filter(t => typeof t === 'string'),
              status: i.status || 'draft',
              progress: i.progress || 'not-started',
              action: i.action || '',
              result: i.result || '',
              created_at: Number(i.createdAt) || 0,
              pinned_at: i.pinnedAt ? Number(i.pinnedAt) : null
            }))
          );
          if (iRes.error) console.error('insert items 失败:', iRes.error);
        }
        const tagEntries = Object.entries(store.tagsColorMap);
        if (tagEntries.length) {
          const tRes = await sbClient.from('tag_colors').insert(
            tagEntries.map(([tag, color]) => ({ user_id: userId, tag, color }))
          );
          if (tRes.error) console.error('insert tag_colors 失败:', tRes.error);
        }
      } catch (e) {
        console.error('同步云端失败', e);
      } finally {
        isSyncing = false;
        if (syncPending) {
          syncPending = false;
          scheduleSync();
        }
      }
    }

    async function migrateLocalToCloudIfNeeded() {
      // 云端优先：只在云端完全为空（新账号首次登录）时，才从本地迁移旧数据
      if (store.items.length > 0 || store.folders.length > 0) return;
      const local = localStorage.getItem(STORAGE_KEY_V2);
      if (!local) return;
      try {
        const parsed = JSON.parse(local);
        if (!parsed.items || parsed.items.length === 0) return;
        store.folders = parsed.folders || [];
        store.tagsColorMap = parsed.tagsColorMap || {};
        store.items = parsed.items || [];
        store.settings = parsed.settings || store.settings;
        await saveToCloud();
        saveToStorage();
      } catch (e) {
        console.error('本地数据迁移失败', e);
      }
    }

    function migrateFromV1(v1) {
      const defaultFolder = { id: generateId('folder'), name: '未分类', order: 0 };
      store.folders = [defaultFolder];
      store.settings.selectedFolderId = defaultFolder.id;
      store.tagsColorMap = {};
      store.items = [];

      (v1.drafts || []).forEach((d, idx) => {
        store.items.push({
          id: d.id || generateId('item'),
          text: d.text,
          folderId: defaultFolder.id,
          tags: normalizeTags(d.tags || extractTags(d.text)),
          status: 'draft',
          progress: 'not-started',
          action: '',
          createdAt: d.createdAt || Date.now() + idx,
          pinnedAt: null
        });
      });

      (v1.archives || []).forEach((a, idx) => {
        const isPinned = a.pinned;
        const item = {
          id: a.id || generateId('item'),
          text: a.text,
          folderId: defaultFolder.id,
          tags: normalizeTags(a.tags || extractTags(a.text)),
          status: isPinned ? 'pinned' : 'archived',
          progress: isPinned ? 'in-progress' : 'not-started',
          action: a.action || '',
          createdAt: a.createdAt || Date.now() + idx,
          pinnedAt: isPinned ? (Date.now() + idx) : null
        };
        store.items.push(item);
      });

      store.items.forEach(item => {
        item.tags.forEach(tag => ensureTagColor(tag));
      });

      saveToStorage();
    }

    function normalizeTags(tags) {
      return [...new Set(tags.map(t => String(t).toLowerCase()))];
    }

    function ensureDefaults() {
      if (store.folders.length === 0) {
        const defaultFolders = ['学术', '手工', '运营', 'AI'];
        store.folders = defaultFolders.map((name, idx) => ({
          id: generateId('folder'),
          name,
          order: idx
        }));
      }
      if (!store.settings.selectedFolderId || !store.folders.find(f => f.id === store.settings.selectedFolderId)) {
        store.settings.selectedFolderId = store.folders[0].id;
      }
      if (store.settings.draftPanelOpen === undefined) {
        store.settings.draftPanelOpen = true;
      }
    }

    // 颜色
    function ensureTagColor(tag) {
      if (!store.tagsColorMap[tag]) {
        const used = Object.values(store.tagsColorMap);
        const available = DEFAULT_COLORS.filter(c => !used.includes(c));
        store.tagsColorMap[tag] = available.length > 0 ? available[0] : DEFAULT_COLORS[used.length % DEFAULT_COLORS.length];
      }
      return store.tagsColorMap[tag];
    }

    function getTagColor(tag) {
      return store.tagsColorMap[tag] || ensureTagColor(tag);
    }

    function getProgressLabel(progress) {
      const labels = {
        'not-started': '未开始',
        'in-progress': '进行中',
        'completed': '已完成'
      };
      return labels[progress] || '未开始';
    }

    function setTagColor(tag, color) {
      store.tagsColorMap[tag] = color;
      saveToStorage();
      render();
    }

    function toggleTagFilter(tag) {
      uiState.selectedTag = uiState.selectedTag === tag ? null : tag;
      render();
    }

    // 派生数据
    function getCurrentFolder() {
      return store.folders.find(f => f.id === store.settings.selectedFolderId) || store.folders[0];
    }

    function getFolderItems(folderId, status) {
      return store.items.filter(i => i.folderId === folderId && (!status || i.status === status));
    }

    function getFolderTags(folderId) {
      const tags = new Set();
      store.items
        .filter(i => i.folderId === folderId && (i.status === 'archived' || i.status === 'pinned'))
        .forEach(i => i.tags.forEach(t => tags.add(t)));
      return [...tags].sort();
    }

    function getAllTags() {
      const tags = new Set();
      store.items.forEach(i => i.tags.forEach(t => tags.add(t)));
      return [...tags].sort();
    }

    function getPinnedItems() {
      return store.items
        .filter(i => i.status === 'pinned' && i.progress === 'in-progress')
        .sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0));
    }

    // 文件夹操作
    function createFolder(name) {
      const folder = {
        id: generateId('folder'),
        name: name.trim() || '新文件夹',
        order: store.folders.length
      };
      store.folders.push(folder);
      store.settings.selectedFolderId = folder.id;
      saveToStorage();
      render();
    }

    function renameFolder(id, name) {
      const folder = store.folders.find(f => f.id === id);
      if (folder) {
        folder.name = name.trim() || folder.name;
        uiState.editingItemId = null;
        saveToStorage();
        render();
      }
    }

    function deleteFolder(id) {
      if (store.folders.length <= 1) {
        showModal('至少需要保留一个文件夹');
        return;
      }
      if (!confirm('删除文件夹会同时删除其中的所有灵感，确定吗？')) return;
      store.items = store.items.filter(i => i.folderId !== id);
      store.folders = store.folders.filter(f => f.id !== id);
      if (store.settings.selectedFolderId === id) {
        store.settings.selectedFolderId = store.folders[0].id;
      }
      saveToStorage();
      render();
    }

    function selectFolder(id) {
      store.settings.selectedFolderId = id;
      saveToStorage();
      render();
    }

    function moveItemToFolder(itemId, folderId) {
      const item = store.items.find(i => i.id === itemId);
      if (item && item.folderId !== folderId) {
        item.folderId = folderId;
        saveToStorage();
        render();
      }
    }

    function openMoveModal(itemId) {
      pendingMoveItemId = itemId;
      const item = store.items.find(i => i.id === itemId);
      const currentFolderId = item ? item.folderId : null;

      const options = store.folders.filter(f => f.id !== currentFolderId);
      if (options.length === 0) {
        ui.moveFolderList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:8px;">没有其他文件夹</div>';
      } else {
        ui.moveFolderList.innerHTML = options.map(f => `
          <div class="move-folder-option" data-id="${f.id}">${escapeHtml(f.name)}</div>
        `).join('');
      }

      ui.moveFolderList.querySelectorAll('.move-folder-option').forEach(opt => {
        opt.addEventListener('click', () => {
          moveItemToFolder(itemId, opt.dataset.id);
          closeMoveModal();
        });
      });

      ui.moveModalOverlay.classList.add('open');
    }

    function closeMoveModal() {
      ui.moveModalOverlay.classList.remove('open');
      pendingMoveItemId = null;
    }

    // 灵感操作
    function handleDump() {
      const text = ui.captureInput.value.trim();
      if (!text) return;

      // 按行拆分：Shift+Enter 换行的每一行作为一个独立灵感
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length === 0) return;

      const folderId = getCurrentFolder().id;
      lines.forEach(line => addItem(line, folderId));

      ui.captureInput.value = '';
      render();
    }

    function addItem(text, folderId) {
      const tags = extractTags(text);
      tags.forEach(tag => ensureTagColor(tag));
      store.items.unshift({
        id: generateId('item'),
        text,
        folderId,
        tags,
        status: 'draft',
        progress: 'not-started',
        action: '',
        createdAt: Date.now(),
        pinnedAt: null
      });
      saveToStorage();
    }

    function approveItem(id) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.status = 'archived';
        item.progress = 'not-started';
        saveToStorage();
        render();
      }
    }

    function deleteItem(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;
      const statusMap = { draft: '草稿', archived: '存档', pinned: '已钉住' };
      if (!confirm(`确定要删除这条${statusMap[item.status] || '灵感'}吗？`)) return;
      store.items = store.items.filter(i => i.id !== id);
      saveToStorage();
      render();
    }

    function updateItemText(id, text) {
      const item = store.items.find(i => i.id === id);
      if (!item) return false;
      const trimmed = text.trim();
      if (!trimmed) {
        alert('内容不能为空');
        return false;
      }
      item.text = trimmed;
      item.tags = extractTags(trimmed);
      item.tags.forEach(tag => ensureTagColor(tag));
      saveToStorage();
      return true;
    }

    function updateItemAction(id, text) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.action = text;
        saveToStorage();
      }
    }

    function pinItem(id, actionText) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;

      const currentPinned = store.items.filter(i => i.status === 'pinned').length;
      if (currentPinned >= MAX_PINNED) {
        showModal('今日只能专注3件事！请先完成一项。');
        return;
      }

      item.action = (actionText || '').trim();
      item.status = 'pinned';
      item.progress = 'in-progress';
      item.pinnedAt = Date.now();
      saveToStorage();
      render();
    }

    function cycleProgress(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;

      const transitions = {
        'not-started': 'in-progress',
        'in-progress': 'completed',
        'completed': 'not-started'
      };

      const newProgress = transitions[item.progress] || 'not-started';
      item.progress = newProgress;

      if (newProgress === 'in-progress') {
        const currentPinned = store.items.filter(i => i.status === 'pinned').length;
        if (currentPinned >= MAX_PINNED) {
          showModal('今日只能专注3件事！请先完成一项。');
          item.progress = 'not-started';
          return;
        }
        item.status = 'pinned';
        item.pinnedAt = Date.now();
      } else {
        item.status = 'archived';
        item.pinnedAt = null;
      }

      saveToStorage();
      render();
    }

    function archiveItem(id) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.status = 'archived';
        item.progress = 'completed';
        item.pinnedAt = null;
        saveToStorage();
        render();
      }
    }

    function unpinItem(id) {
      archiveItem(id);
    }

    function updateItemResult(id, text) {
      const item = store.items.find(i => i.id === id);
      if (item) {
        item.result = text;
        saveToStorage();
      }
    }
    function startEditItem(id) {
      const item = store.items.find(i => i.id === id);
      if (!item) return;
      uiState.editingItemId = id;
      uiState.editingText = item.text;
      render();
    }

    function saveItemEdit(id) {
      if (updateItemText(id, uiState.editingText)) {
        uiState.editingItemId = null;
        uiState.editingText = '';
        render();
      }
    }

    function cancelItemEdit() {
      uiState.editingItemId = null;
      uiState.editingText = '';
      render();
    }

    // 弹窗
    function showModal(message) {
      ui.modalMessage.textContent = message;
      ui.modalOverlay.classList.add('open');
    }

    function hideModal() {
      ui.modalOverlay.classList.remove('open');
    }

    // 事件绑定
    function bindEvents() {
      ui.dumpBtn.addEventListener('click', handleDump);
      ui.captureInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleDump();
        }
      });

      ui.draftToggle.addEventListener('click', () => {
        store.settings.draftPanelOpen = !store.settings.draftPanelOpen;
        saveToStorage();
        render();
      });

      ui.addFolderBtn.addEventListener('click', () => {
        const name = prompt('新建文件夹名称：');
        if (name !== null) createFolder(name);
      });

      ui.modalClose.addEventListener('click', hideModal);
      ui.modalOverlay.addEventListener('click', (e) => {
        if (e.target === ui.modalOverlay) hideModal();
      });

      ui.moveCancel.addEventListener('click', closeMoveModal);
      ui.moveModalOverlay.addEventListener('click', (e) => {
        if (e.target === ui.moveModalOverlay) closeMoveModal();
      });

    }

    // 渲染
    function render() {
      renderSidebar();
      renderPinned();
      renderDraftPanel();
      renderTable();
      renderMobileList();
    }

    function renderSidebar() {
      renderFolderList();
      renderTagList();
    }

    function renderFolderList() {
      const currentFolder = getCurrentFolder();
      ui.folderList.innerHTML = store.folders.sort((a, b) => a.order - b.order).map(folder => {
        const count = store.items.filter(i => i.folderId === folder.id).length;
        const isSelected = folder.id === currentFolder.id;
        const isEditing = uiState.editingItemId === `folder_${folder.id}`;
        return `
          <div class="folder-item ${isSelected ? 'active' : ''}" data-id="${folder.id}">
            ${isEditing ? `
              <input type="text" class="inline-input folder-rename-input" value="${escapeHtml(folder.name)}" data-id="${folder.id}" />
            ` : `
              <div class="folder-name-wrap" style="flex:1;">
                <span class="folder-name">${escapeHtml(folder.name)}</span>
                <span class="folder-count">${count}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px;">
                <button class="folder-btn" data-id="${folder.id}" data-action="rename" title="重命名">✎</button>
                <button class="folder-btn danger" data-id="${folder.id}" data-action="delete" title="删除">×</button>
              </div>
            `}
          </div>
        `;
      }).join('');

      ui.folderList.querySelectorAll('.folder-item').forEach(item => {
        const id = item.dataset.id;
        const input = item.querySelector('.folder-rename-input');
        if (input) {
          input.focus();
          input.addEventListener('blur', () => renameFolder(id, input.value));
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') renameFolder(id, input.value);
            if (e.key === 'Escape') {
              uiState.editingItemId = null;
              render();
            }
          });
        } else {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.folder-btn')) return;
            selectFolder(id);
          });

          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', () => {
            item.classList.remove('drag-over');
          });
          item.addEventListener('drop', (e) => {
            e.preventDefault();
            item.classList.remove('drag-over');
            const itemId = e.dataTransfer.getData('text/plain');
            if (itemId) moveItemToFolder(itemId, id);
          });

          const renameBtn = item.querySelector('[data-action="rename"]');
          const deleteBtn = item.querySelector('[data-action="delete"]');

          if (renameBtn) {
            renameBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              uiState.editingItemId = `folder_${id}`;
              render();
            });
          }

          if (deleteBtn) {
            deleteBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm('删除这个文件夹？')) deleteFolder(id);
            });
          }
        }
      });
    }

    function renderTagList() {
      const currentFolder = getCurrentFolder();
      if (!currentFolder) return;
      const tags = getFolderTags(currentFolder.id);

      if (tags.length === 0) {
        ui.tagList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:8px 0;">该文件夹暂无标签</div>';
        return;
      }

      ui.tagList.innerHTML = tags.map(tag => {
        const color = getTagColor(tag);
        return `
          <div class="tag-item ${uiState.selectedTag === tag ? 'active' : ''}" data-tag="${escapeHtml(tag)}">
            <div class="tag-name-wrap">
              <span class="tag-dot" style="background:${color}"></span>
              <span class="tag-name">${escapeHtml(tag)}</span>
            </div>
          </div>
        `;
      }).join('');

      ui.tagList.querySelectorAll('.tag-item').forEach(item => {
        item.addEventListener('click', () => {
          toggleTagFilter(item.dataset.tag);
        });
      });
    }

    function renderColorPopover(tag) {
      const current = getTagColor(tag);
      return `
        <div class="color-popover open" data-tag="${escapeHtml(tag)}">
          <div class="color-presets">
            ${DEFAULT_COLORS.map(c => `<div class="color-preset" data-color="${c}" style="background:${c}; ${c === current ? 'border-color:var(--text)' : ''}"></div>
            `).join('')}
          </div>
          <div class="color-custom-row">
            <span>自定义</span>
            <input type="color" value="${current}" data-tag="${escapeHtml(tag)}" />
          </div>
        </div>
      `;
    }

    function bindColorPopoverEvents() {
      document.querySelectorAll('.color-preset').forEach(preset => {
        preset.addEventListener('click', (e) => {
          e.stopPropagation();
          setTagColor(preset.dataset.tag, preset.dataset.color);
          uiState.colorEditingTag = null;
        });
      });

      document.querySelectorAll('.color-custom-row input[type="color"]').forEach(input => {
        input.addEventListener('input', () => {
          setTagColor(input.dataset.tag, input.value);
        });
      });
    }

    function renderPinned() {
      const pinned = getPinnedItems();

      if (pinned.length === 0) {
        ui.pinnedList.innerHTML = '<div class="pinned-empty">还没有钉住任何事。在灵感清单中写下「1分钟行动」并钉住。</div>';
        return;
      }

      ui.pinnedList.innerHTML = pinned.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        return `
          <div class="pinned-card">
            ${isEditing ? `
              <div style="flex:1;">
                <textarea class="edit-textarea" data-id="${item.id}">${escapeHtml(uiState.editingText)}</textarea>
                <div class="edit-actions">
                  <button class="btn-save" data-id="${item.id}">保存</button>
                  <button class="btn-cancel" data-id="${item.id}">取消</button>
                </div>
              </div>
            ` : `
              <div class="pinned-content">
                <div class="pinned-text">${escapeHtml(item.text)}</div>
                ${item.tags.length ? `<div class="pinned-tags">${item.tags.map(t => `<span class="pinned-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                ${item.action ? `<div class="pinned-action">${escapeHtml(item.action)}</div>` : ''}
                <div class="pinned-meta">${formatDate(item.createdAt)}</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <button class="btn-done" data-id="${item.id}" title="完成">✔</button>
                <button class="btn-table" data-id="${item.id}" data-action="edit" title="编辑">编</button>
              </div>
            `}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.pinnedList, 'item');

      ui.pinnedList.querySelectorAll('.btn-done').forEach(btn => {
        btn.addEventListener('click', () => unpinItem(btn.dataset.id));
      });
    }

    function renderDraftPanel() {
      const currentFolder = getCurrentFolder();
      const drafts = getFolderItems(currentFolder.id, 'draft');
      ui.draftCount.textContent = drafts.length;
      ui.draftPanel.classList.toggle('open', store.settings.draftPanelOpen);
      ui.draftToggle.querySelector('span').textContent = store.settings.draftPanelOpen ? '收起草稿箱' : '显示草稿箱';

      if (drafts.length === 0) {
        ui.draftList.innerHTML = '<div class="empty-state" style="border:none; background:transparent; padding:12px 0;">当前文件夹草稿箱是空的。</div>';
        return;
      }

      ui.draftList.innerHTML = drafts.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        return `
          <div class="mobile-card">
            ${isEditing ? renderEditMode(item.id) : renderDraftCard(item)}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.draftList, 'item');

      ui.draftList.querySelectorAll('[data-action="approve"]').forEach(btn => {
        btn.addEventListener('click', () => approveItem(btn.dataset.id));
      });

      ui.draftList.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteItem(btn.dataset.id));
      });
    }

    function renderDraftCard(item) {
      return `
        <div class="mobile-text">${escapeHtml(item.text)}</div>
        ${item.tags.length ? `<div class="mobile-tags">${item.tags.map(t => `<span class="mobile-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="mobile-actions">
          <button class="btn-table btn-approve" data-id="${item.id}" data-action="approve">认可 ✓</button>
          <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
          <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
        </div>
        <div style="font-size:11px; color:var(--gray-text); margin-top:6px;">${formatDate(item.createdAt)}</div>
      `;
    }

    function renderEditMode(id) {
      return `
        <textarea class="edit-textarea" data-id="${id}">${escapeHtml(uiState.editingText)}</textarea>
        <div class="edit-actions">
          <button class="btn-save" data-id="${id}">保存</button>
          <button class="btn-cancel" data-id="${id}">取消</button>
        </div>
      `;
    }

    function renderTable() {
      const currentFolder = getCurrentFolder();
      let items = getFolderItems(currentFolder.id, 'archived').concat(
        getFolderItems(currentFolder.id, 'pinned')
      );

      if (uiState.selectedTag) {
        items = items.filter(i => i.tags.includes(uiState.selectedTag));
      }

      // 排序：进行中 → 未开始 → 已完成
      const progressOrder = { 'in-progress': 0, 'not-started': 1, 'completed': 2 };
      items.sort((a, b) => {
        const pa = progressOrder[a.progress] || 0;
        const pb = progressOrder[b.progress] || 0;
        if (pa !== pb) return pa - pb;
        return b.createdAt - a.createdAt;
      });

      if (items.length === 0) {
        ui.tableSection.innerHTML = '<div class="empty-state">该文件夹下还没有存档灵感。</div>';
        return;
      }

      const rows = items.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        const progressLabel = getProgressLabel(item.progress);
        const progressClass = `progress-${item.progress}`;

        return `
          <tr class="${progressClass}">
            <td class="col-content">
              ${isEditing ? `
                <textarea class="edit-textarea" data-id="${item.id}">${escapeHtml(uiState.editingText)}</textarea>
                <div class="edit-actions">
                  <button class="btn-save" data-id="${item.id}">保存</button>
                  <button class="btn-cancel" data-id="${item.id}">取消</button>
                </div>
              ` : `<div class="cell-content" draggable="true" data-id="${item.id}" title="拖到左侧文件夹可移动">${escapeHtml(item.text)}</div>`}
            </td>
            <td class="col-progress">
              ${isEditing ? '' : `<button class="btn-table progress-btn ${progressClass}" data-id="${item.id}" data-action="progress">${progressLabel}</button>`}
            </td>
            <td class="col-actions">
              ${isEditing ? '' : `
                <div class="cell-actions">
                  <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
                  <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
                  <button class="btn-table" data-id="${item.id}" data-action="move">移动</button>
                  <button class="btn-table" data-id="${item.id}" data-action="archive">钉住</button>
                </div>
              `}
            </td>
            <td class="col-action-input">
              ${isEditing ? '' : `
                <input
                  type="text"
                  class="action-input-table"
                  placeholder="若只做1分钟，我先干嘛？"
                  value="${escapeHtml(item.action || '')}"
                  data-id="${item.id}"
                />
              `}
            </td>
            <td class="col-result-input">
              ${isEditing ? '' : `
                <input
                  type="text"
                  class="action-input-table"
                  placeholder="丢下参考/高光/复盘等珍贵瞬间"
                  value="${escapeHtml(item.result || '')}"
                  data-id="${item.id}"
                  data-field="result"
                />
              `}
            </td>
          </tr>
        `;
      }).join('');

      ui.tableSection.innerHTML = `
        <table class="inspiration-table">
          <thead>
            <tr>
              <th class="col-content">灵感</th>
              <th class="col-progress">进度</th>
              <th class="col-actions">操作</th>
              <th class="col-action-input">1分钟行动</th>
              <th class="col-result-input">行动备注</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      bindEditEvents(ui.tableSection, 'item');

      ui.tableSection.querySelectorAll('.cell-content[draggable="true"]').forEach(el => {
        el.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', el.dataset.id);
          e.dataTransfer.effectAllowed = 'move';
        });
      });

      ui.tableSection.querySelectorAll('.action-input-table').forEach(input => {
        input.addEventListener('change', () => {
          if (input.dataset.field === 'result') {
            updateItemResult(input.dataset.id, input.value);
          } else {
            updateItemAction(input.dataset.id, input.value);
          }
        });
      });

      ui.tableSection.querySelectorAll('.cell-actions button, .col-progress button').forEach(btn => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'edit') {
          btn.addEventListener('click', () => startEditItem(id));
        } else if (action === 'delete') {
          btn.addEventListener('click', () => deleteItem(id));
        } else if (action === 'progress') {
          btn.addEventListener('click', () => cycleProgress(id));
        } else if (action === 'move') {
          btn.addEventListener('click', () => openMoveModal(id));
        } else if (action === 'archive') {
          btn.addEventListener('click', () => {
            const input = btn.closest('tr').querySelector('.action-input-table');
            pinItem(id, input ? input.value : '');
          });
        }
      });
    }

    function renderMobileList() {
      const currentFolder = getCurrentFolder();
      let items = getFolderItems(currentFolder.id, 'archived').concat(
        getFolderItems(currentFolder.id, 'pinned')
      );

      if (uiState.selectedTag) {
        items = items.filter(i => i.tags.includes(uiState.selectedTag));
      }

      const progressOrder = { 'in-progress': 0, 'not-started': 1, 'completed': 2 };
      items.sort((a, b) => {
        const pa = progressOrder[a.progress] || 0;
        const pb = progressOrder[b.progress] || 0;
        if (pa !== pb) return pa - pb;
        return b.createdAt - a.createdAt;
      });

      if (items.length === 0) {
        ui.mobileList.innerHTML = '<div class="empty-state">该文件夹下还没有存档灵感。</div>';
        return;
      }

      ui.mobileList.innerHTML = items.map(item => {
        const isEditing = uiState.editingItemId === item.id;
        const progressLabel = getProgressLabel(item.progress);
        return `
          <div class="mobile-card progress-${item.progress}">
            ${isEditing ? renderEditMode(item.id) : `
              <div class="mobile-text">${escapeHtml(item.text)}</div>
              ${item.tags.length ? `<div class="mobile-tags">${item.tags.map(t => `<span class="mobile-tag" style="background:${getTagColor(t)}22; border-left:3px solid ${getTagColor(t)}">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
              <div class="mobile-actions">
                <button class="btn-table" data-id="${item.id}" data-action="edit">编辑</button>
                <button class="btn-table danger" data-id="${item.id}" data-action="delete">删除</button>
                <button class="btn-table" data-id="${item.id}" data-action="move">移动</button>
                <button class="btn-table" data-id="${item.id}" data-action="archive">钉住</button>
              </div>
              <div style="margin-bottom:8px;">
                <button class="btn-table progress-btn progress-${item.progress}" data-id="${item.id}" data-action="progress" style="width:100%;">${progressLabel}</button>
              </div>
              <div class="mobile-action-box">
                <input
                  type="text"
                  placeholder="若只做1分钟，我先干嘛？"
                  value="${escapeHtml(item.action || '')}"
                  data-id="${item.id}"
                />
              </div>
              <div class="mobile-action-box" style="margin-top:6px;">
                <input
                  type="text"
                  placeholder="丢下参考/高光/复盘等珍贵瞬间"
                  value="${escapeHtml(item.result || '')}"
                  data-id="${item.id}"
                  data-field="result"
                />
              </div>
              <div style="font-size:11px; color:var(--gray-text); margin-top:6px;">${formatDate(item.createdAt)}</div>
            `}
          </div>
        `;
      }).join('');

      bindEditEvents(ui.mobileList, 'item');

      ui.mobileList.querySelectorAll('.mobile-action-box input, .mobile-card > input').forEach(input => {
        input.addEventListener('change', () => {
          if (input.dataset.field === 'result') {
            updateItemResult(input.dataset.id, input.value);
          } else {
            updateItemAction(input.dataset.id, input.value);
          }
        });
      });

      ui.mobileList.querySelectorAll('button').forEach(btn => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'edit') {
          btn.addEventListener('click', () => startEditItem(id));
        } else if (action === 'delete') {
          btn.addEventListener('click', () => deleteItem(id));
        } else if (action === 'progress') {
          btn.addEventListener('click', () => cycleProgress(id));
        } else if (action === 'move') {
          btn.addEventListener('click', () => openMoveModal(id));
        } else if (action === 'archive') {
          btn.addEventListener('click', () => {
            const input = btn.closest('.mobile-card').querySelector('.mobile-action-box input');
            pinItem(id, input ? input.value : '');
          });
        }
      });
    }

    function bindEditEvents(container, type) {
      container.querySelectorAll('.edit-textarea').forEach(textarea => {
        textarea.focus();
        textarea.addEventListener('input', () => {
          uiState.editingText = textarea.value;
        });
        textarea.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            saveItemEdit(textarea.dataset.id);
          }
          if (e.key === 'Escape') {
            cancelItemEdit();
          }
        });
      });

      container.querySelectorAll('.btn-save').forEach(btn => {
        btn.addEventListener('click', () => saveItemEdit(btn.dataset.id));
      });

      container.querySelectorAll('.btn-cancel').forEach(btn => {
        btn.addEventListener('click', () => cancelItemEdit());
      });

      container.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => startEditItem(btn.dataset.id));
      });
    }

    init();
  </script>
</body>
</html>
